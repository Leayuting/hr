function pad2(n) { return String(n).padStart(2, "0"); }
function todayStr() {
  const now = new Date(Date.now() + 8 * 3600 * 1000); // UTC+8，台灣無日光節省時間
  return `${now.getUTCFullYear()}-${pad2(now.getUTCMonth() + 1)}-${pad2(now.getUTCDate())}`;
}
function thisMonthStr() { return todayStr().slice(0, 7); }
function fmtTaipei(iso) {
  if (!iso) return "";
  const d = new Date(new Date(iso).getTime() + 8 * 3600 * 1000);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;
}
const WEEKDAY_ZH = ["日", "一", "二", "三", "四", "五", "六"];
const MONTH_EN = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
function weekdayZh(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return WEEKDAY_ZH[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
}
function fmtDateShort(iso) {
  if (!iso) return "";
  const d = new Date(new Date(iso).getTime() + 8 * 3600 * 1000);
  const wd = WEEKDAY_ZH[d.getUTCDay()];
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}（週${wd}）`;
}
function fmtDateTimeShort(iso) {
  if (!iso) return "";
  const d = new Date(new Date(iso).getTime() + 8 * 3600 * 1000);
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;
}
function addDaysStr(dateStr, n) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d) + n * 86400000);
  return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
}
function weekDatesContaining(dateStr) {
  const dow = new Date(Date.UTC(...dateStr.split("-").map((v, i) => i === 1 ? Number(v) - 1 : Number(v)))).getUTCDay(); // 0=日..6=六
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  return Array.from({ length: 7 }, (_, i) => addDaysStr(dateStr, mondayOffset + i));
}
function monthDays(yearMonth) {
  const [y, m] = yearMonth.split("-").map(Number);
  return new Date(y, m, 0).getDate();
}
function money(n) { return Math.round(Number(n) || 0).toLocaleString("zh-TW"); }
function isHalfHourStep(n) { return Number.isFinite(n) && n > 0 && Math.round(n * 2) === n * 2; }
function shiftHours(startTime, endTime) {
  if (!startTime || !endTime) return 0;
  const [sh, sm] = startTime.split(":").map(Number);
  const [eh, em] = endTime.split(":").map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60; // 跨半夜班次（例如 22:00–02:00）
  return mins / 60;
}
// 加班費依勞基法第24條分級計算，hourlyBase 為平日每小時工資額
function overtimePayForRequest(hourlyBase, hours, overtimeType) {
  const h = Number(hours) || 0;
  if (h <= 0) return 0;
  if (overtimeType === "rest_day") {
    // 休息日加班：前2小時1又1/3、再2小時起至第8小時1又2/3、超過8小時2又2/3
    const t1 = Math.min(h, 2);
    const t2 = Math.min(Math.max(h - 2, 0), 6);
    const t3 = Math.max(h - 8, 0);
    return hourlyBase * ((4 / 3) * t1 + (5 / 3) * t2 + (8 / 3) * t3);
  }
  if (overtimeType === "holiday" || overtimeType === "statutory_rest") {
    // 國定假日／特別休假／例假出勤：工資照給外再加發，此處計算「加發」部分
    return hourlyBase * 1 * h;
  }
  // 平日加班（預設）：前2小時1又1/3、再延長1又2/3
  const t1 = Math.min(h, 2);
  const t2 = Math.max(h - 2, 0);
  return hourlyBase * ((4 / 3) * t1 + (5 / 3) * t2);
}

    <div style={{ width: size, height: size, borderRadius: "999px", background: c.bg, color: c.fg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: Math.round(size * 0.42), fontWeight: 600, flexShrink: 0 }}>
      {name?.slice(0, 1)}
    </div>
  );
}
function RosterCell({ r, index, showStore, storeName }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <RosterAvatar name={r.name} index={index} />
      <div style={{ minWidth: 0 }}>
        <div style={{ fontWeight: 500 }}>{r.name}</div>
        <div style={{ fontSize: 11.5, color: T.sub }}>{r.position}{showStore && storeName ? `・${storeName}` : ""}</div>
      </div>
    </div>
  );
}

function Badge({ children, tone = "sub" }) {
  const map = {
    sub: { color: T.sub, background: T.subBg },
    green: { color: T.green, background: T.greenBg },
    yellow: { color: T.yellow, background: T.yellowBg },
    red: { color: T.red, background: T.redBg },
    olive: { color: T.olive, background: T.oliveBg },
    handoff: { color: T.handoff, background: T.handoffBg },
    brown: { color: T.brown, background: T.brownSoft },
  };
  return <span className="ph-badge" style={map[tone] || map.sub}>{children}</span>;
}

function Modal({ title, onClose, children, wide }) {
  return (
    <div className="ph-modal-backdrop" onMouseDown={() => onClose()}>
      <div className="ph-modal" style={wide ? { maxWidth: 760 } : undefined} onMouseDown={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h3 className="ph-serif" style={{ margin: 0, fontSize: 17 }}>{title}</h3>
          <button className="ph-btn small" onClick={onClose}>關閉</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return <div className="ph-field"><label>{label}</label>{children}</div>;
}

/* ────────────────────────────────────────────
   登入
──────────────────────────────────────────── */

function Login() {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [resetSent, setResetSent] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setErr(""); setBusy(true);
    try {
      const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
      if (error) {
        try { await sb.rpc("record_failed_login", { p_email: email.trim() }); } catch (e3) { /* 記錄失敗次數失敗不影響登入流程 */ }
        setErr("登入失敗，請確認帳號密碼（" + error.message + "）");
      }
    } catch (e2) {
      setErr("登入時發生錯誤：" + (e2?.message || String(e2)));
    } finally {
      setBusy(false);
    }
  }
  async function forgotPw() {
    if (!email.trim()) { setErr("請先輸入 Email"); return; }
    await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.origin + location.pathname });
    setResetSent(true);
  }

  return (
    <div className="ph-root" style={{ display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div className="ph-card" style={{ width: 360, padding: 28 }}>
        <h1 className="ph-serif" style={{ fontSize: 20, marginTop: 0, marginBottom: 4 }}>PHASE 人事排班系統</h1>
        <p style={{ color: T.sub, fontSize: 12.5, marginTop: 0, marginBottom: 20 }}>排班・請假加班・電子日總表・薪資試算</p>
        <form onSubmit={submit}>
          <Field label="Email">
            <input className="ph-input" type="email" name="email" autoComplete="email" required value={email} onChange={(e) => setEmail(e.target.value)} />
          </Field>
          <Field label="密碼">
            <input className="ph-input" type="password" name="password" autoComplete="current-password" required value={pw} onChange={(e) => setPw(e.target.value)} />
          </Field>
          {err && <div className="ph-err">{err}</div>}
          {resetSent && <div style={{ color: T.green, fontSize: 12.5, marginBottom: 8 }}>已寄出重設密碼信件</div>}
          <button className="ph-btn primary" style={{ width: "100%", marginTop: 6 }} disabled={busy} type="submit">
            {busy ? "登入中…" : "登入"}
          </button>
          <button type="button" className="ph-btn" style={{ width: "100%", marginTop: 8, border: "none", background: "none", color: T.sub, fontSize: 12.5 }} onClick={forgotPw}>
            忘記密碼？
          </button>
        </form>
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────
   排班表
──────────────────────────────────────────── */

function prevMonthStr(ym) { const [y, m] = ym.split("-").map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${pad2(m - 1)}`; }
function nextMonthStr(ym) { const [y, m] = ym.split("-").map(Number); return m === 12 ? `${y + 1}-01` : `${y}-${pad2(m + 1)}`; }

function SchedulePage({ me, stores, scope, scopeStoreIds, toast }) {
  const [ym, setYm] = useState(thisMonthStr());
  const [roster, setRoster] = useState([]);
  const [shifts, setShifts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null); // {employeeId, employeeName, employeeStoreId, date}
  const [copying, setCopying] = useState(false);
  const [publishModal, setPublishModal] = useState(false);
  const [mobileDayIdx, setMobileDayIdx] = useState(() => {
    const t = todayStr();
    return t.slice(0, 7) === ym ? Number(t.slice(8, 10)) - 1 : 0;
  });
  const canEdit = me.role === "manager" || me.role === "hr";
  const storeById = useMemo(() => Object.fromEntries(stores.map((s) => [s.id, s])), [stores]);
  const hqStore = useMemo(() => stores.find((s) => s.name === "總部"), [stores]);
  const showHqSection = !!hqStore && !scopeStoreIds.includes(hqStore.id);
  const [hqRoster, setHqRoster] = useState([]);
  const [hqShifts, setHqShifts] = useState([]);

  const load = useCallback(async () => {
    if (!scopeStoreIds.length) return;
    setLoading(true);
    const days = monthDays(ym);
    const from = `${ym}-01`, to = `${ym}-${pad2(days)}`;
    const [empRes, shiftRes] = await Promise.all([
      sb.from("employees").select("id,name,position,store_id,employment_type,active").in("store_id", scopeStoreIds).eq("active", true).order("name"),
      sb.from("shifts").select("*").in("store_id", scopeStoreIds).gte("work_date", from).lte("work_date", to),
    ]);
    if (empRes.error) console.error("employees", empRes.error);
    if (shiftRes.error) console.error("shifts", shiftRes.error);
    setRoster(empRes.data || []);
    setShifts(shiftRes.data || []);
    setLoading(false);
  }, [scopeStoreIds, ym]);

  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    const ch = sb.channel("schedule_sync")
      .on("postgres_changes", { event: "*", schema: "public", table: "shifts" }, () => load())
      .subscribe();
    return () => sb.removeChannel(ch);
  }, [load]);

  const loadHq = useCallback(async () => {
    if (!showHqSection) { setHqRoster([]); setHqShifts([]); return; }
    const days = monthDays(ym);
    const from = `${ym}-01`, to = `${ym}-${pad2(days)}`;
    const [rosterRes, shiftRes] = await Promise.all([
      sb.rpc("store_roster", { p_store_id: hqStore.id }),
      sb.from("shifts").select("*").eq("store_id", hqStore.id).gte("work_date", from).lte("work_date", to),
    ]);
    if (rosterRes.error) console.error("hq store_roster", rosterRes.error);
    if (shiftRes.error) console.error("hq shifts", shiftRes.error);
    setHqRoster((rosterRes.data || []).filter((r) => r.active));
    setHqShifts(shiftRes.data || []);
  }, [showHqSection, hqStore, ym]);

  useEffect(() => { loadHq(); }, [loadHq]);

  useEffect(() => {
    if (!showHqSection) return;
    const ch = sb.channel("schedule_hq_sync")
      .on("postgres_changes", { event: "*", schema: "public", table: "shifts" }, () => loadHq())
      .subscribe();
    return () => sb.removeChannel(ch);
  }, [showHqSection, loadHq]);

  const days = monthDays(ym);
  const dateList = Array.from({ length: days }, (_, i) => `${ym}-${pad2(i + 1)}`);
  const shiftMap = useMemo(() => {
    const m = {};
    shifts.forEach((s) => { m[`${s.employee_id}_${s.work_date}`] = s; });
    return m;
  }, [shifts]);
  const totalShiftCount = shifts.filter((s) => !s.is_day_off).length;
  const totalHours = shifts.reduce((sum, s) => {
    if (s.is_day_off) return sum;
    return sum + shiftHours(s.start_time, s.end_time);
  }, 0);

  async function saveShift(employeeId, employeeStoreId, date, { startTime, endTime, isDayOff, note }) {
    const payload = {
      employee_id: employeeId, store_id: employeeStoreId, work_date: date,
      start_time: isDayOff ? null : (startTime || null),
      end_time: isDayOff ? null : (endTime || null),
      is_day_off: isDayOff, note: note || "",
      updated_by: me.id, updated_at: new Date().toISOString(),
    };
    const { error } = await sb.from("shifts").upsert(payload, { onConflict: "employee_id,work_date" });
    if (error) { toast("儲存失敗：" + (error.message.includes("row-level security") ? "此月份薪資已鎖定或無權限" : error.message)); return; }
    await logAudit(me.name, "update_shift", `${employeeId}:${date}`, isDayOff ? "休" : `${startTime}-${endTime}`);
    setEditing(null);
    load();
  }

  async function copyLastMonth() {
    setCopying(true);
    const prevYm = prevMonthStr(ym);
    const prevDays = monthDays(prevYm);
    const { data: prevShifts, error } = await sb.from("shifts").select("*").in("store_id", scopeStoreIds)
      .gte("work_date", `${prevYm}-01`).lte("work_date", `${prevYm}-${pad2(prevDays)}`);
    if (error) { toast("讀取上月班表失敗：" + error.message); setCopying(false); return; }
    const rosterIds = new Set(roster.map((r) => r.id));
    const existingKeys = new Set(shifts.map((s) => `${s.employee_id}_${s.work_date}`));
    const toInsert = [];
    (prevShifts || []).forEach((s) => {
      if (!rosterIds.has(s.employee_id)) return;
      const dayNum = Number(s.work_date.slice(8, 10));
      if (dayNum > days) return;
      const targetDate = `${ym}-${pad2(dayNum)}`;
      const key = `${s.employee_id}_${targetDate}`;
      if (existingKeys.has(key)) return;
      toInsert.push({
        employee_id: s.employee_id, store_id: s.store_id, work_date: targetDate,
        start_time: s.start_time, end_time: s.end_time, is_day_off: s.is_day_off, note: "",
        updated_by: me.id, updated_at: new Date().toISOString(),
      });
      existingKeys.add(key);
    });
    if (!toInsert.length) { toast("沒有可複製的班次（可能本月已有排班資料）"); setCopying(false); return; }
    const { error: insErr } = await sb.from("shifts").upsert(toInsert, { onConflict: "employee_id,work_date" });
    setCopying(false);
    if (insErr) { toast("複製失敗：" + insErr.message); return; }
    await logAudit(me.name, "copy_last_month_schedule", ym, `複製 ${toInsert.length} 筆`);
    toast(`已從 ${prevYm} 複製 ${toInsert.length} 筆班次`);
    load();
  }

  async function confirmPublish() {
    await logAudit(me.name, "publish_schedule", ym, `門市範圍：${scope === "all" ? "全部門市" : storeById[scopeStoreIds[0]]?.name || ""}`);
    setPublishModal(false);
    toast(`已確認發布 ${ym} 班表`);
  }

  const scopeName = scope === "all" ? "全部門市" : (storeById[scopeStoreIds[0]]?.name || "");

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 4 }}>
        <div>
          <p className="ph-eyebrow" style={{ margin: 0 }}>{scopeName}</p>
          <h2 className="ph-serif" style={{ margin: "2px 0 0", fontSize: 26 }}>{ym.slice(0, 4)}年{Number(ym.slice(5, 7))}月</h2>
        </div>
        {canEdit && (
          <div style={{ display: "flex", gap: 8 }}>
            <button className="ph-btn small" disabled={copying} onClick={copyLastMonth}>{copying ? "複製中…" : "複製上月"}</button>
            <button className="ph-btn small primary" onClick={() => setPublishModal(true)}>發布{Number(ym.slice(5, 7))}月班表</button>
          </div>
        )}
      </div>
      <p style={{ color: T.sub, fontSize: 12.5, marginTop: 4, marginBottom: 12 }}>
        整月排班（{Number(ym.slice(5, 7))}/1–{Number(ym.slice(5, 7))}/{days}）；各門店分開處理，點擊班次即可修改。
      </p>
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 4 }}>
          <button className="ph-btn small" onClick={() => setYm(prevMonthStr(ym))}>‹ 上個月</button>
          <button className="ph-btn small" onClick={() => setYm(thisMonthStr())}>今天</button>
          <button className="ph-btn small" onClick={() => setYm(nextMonthStr(ym))}>下個月 ›</button>
        </div>
        <input className="ph-input" style={{ width: 140 }} type="month" value={ym} onChange={(e) => setYm(e.target.value)} />
      </div>
      <div className="ph-schedule-preview-desktop">
        <div className="ph-card" style={{ padding: "10px 16px", marginBottom: 10, fontSize: 12.5, color: T.sub }}>
          左右滑動查看當月全部日期，夥伴姓名會固定在左側。
        </div>
        {loading ? <p style={{ color: T.sub }}>載入中…</p> : (
          <div className="ph-card" style={{ overflowX: "auto" }}>
            <table className="ph-table ph-schedule-preview">
              <thead>
                <tr>
                  <th style={{ position: "sticky", left: 0, background: "#FCFAF6", zIndex: 1, minWidth: 140 }}>夥伴</th>
                  {dateList.map((d) => {
                    const wd = weekdayZh(d);
                    const isWeekend = wd === "六" || wd === "日";
                    return <th key={d} className={isWeekend ? "weekend" : ""} style={{ whiteSpace: "nowrap" }}>週{wd}<br /><span style={{ fontWeight: 400 }}>{d.slice(5)}</span></th>;
                  })}
                </tr>
              </thead>
              <tbody>
                {roster.map((r, idx) => (
                  <tr key={r.id}>
                    <td style={{ position: "sticky", left: 0, background: "#fff", minWidth: 140, whiteSpace: "nowrap" }}>
                      <RosterCell r={r} index={idx} showStore={scopeStoreIds.length > 1} storeName={storeById[r.store_id]?.name} />
                    </td>
                    {dateList.map((d) => {
                      const s = shiftMap[`${r.id}_${d}`];
                      const mine = r.id === me.id;
                      return (
                        <td key={d} className={"ph-daycell" + (s?.is_day_off ? " off" : "")}
                          style={mine ? { background: T.brownSoft } : undefined}
                          onClick={() => canEdit && setEditing({ employeeId: r.id, employeeName: r.name, employeeStoreId: r.store_id, storeName: storeById[r.store_id]?.name, date: d, existing: s })}>
                          {s ? (s.is_day_off ? "休" : `${(s.start_time || "").slice(0, 5)}\n${(s.end_time || "").slice(0, 5)}`) : "—"}
                        </td>
                      );
                    })}
                  </tr>
                ))}
                {roster.length === 0 && <tr><td colSpan={days + 1} style={{ color: T.sub, textAlign: "center" }}>此範圍尚無在職夥伴</td></tr>}
              </tbody>
            </table>
          </div>
        )}
        {!loading && roster.length > 0 && (
          <div style={{ marginTop: 10, fontSize: 12.5, color: T.sub, display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
            <span>
              本月共 <strong style={{ color: T.ink }}>{totalShiftCount}</strong> 個班次
              <span style={{ marginLeft: 16 }}>預計工時 <strong style={{ color: T.ink }}>{Math.round(totalHours)}</strong> 小時</span>
            </span>
            <span style={{ color: T.green }}>✓ {scopeStoreIds.length > 1 ? "已依門店分開顯示" : `${scopeName}資料獨立`}</span>
          </div>
        )}
      </div>

      <div className="ph-schedule-preview-mobile">
        {loading ? <p style={{ color: T.sub }}>載入中…</p> : roster.length === 0 ? (
          <p style={{ color: T.sub, fontSize: 13, textAlign: "center", padding: "24px 0" }}>此範圍尚無在職夥伴</p>
        ) : (
          <div className="ph-card" style={{ padding: 14 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
              <button className="ph-btn small" onClick={() => setMobileDayIdx((i) => Math.max(0, i - 1))} disabled={mobileDayIdx === 0}>‹</button>
              <span style={{ fontSize: 14, fontWeight: 500 }}>{dateList[mobileDayIdx]}（週{weekdayZh(dateList[mobileDayIdx])}）</span>
              <button className="ph-btn small" onClick={() => setMobileDayIdx((i) => Math.min(days - 1, i + 1))} disabled={mobileDayIdx === days - 1}>›</button>
            </div>
            {roster.map((r, idx) => {
              const d = dateList[mobileDayIdx];
              const s = shiftMap[`${r.id}_${d}`];
              return (
                <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: `1px solid ${T.line}`, cursor: canEdit ? "pointer" : "default" }}
                  onClick={() => canEdit && setEditing({ employeeId: r.id, employeeName: r.name, employeeStoreId: r.store_id, storeName: storeById[r.store_id]?.name, date: d, existing: s })}>
                  <RosterCell r={r} index={idx} showStore storeName={storeById[r.store_id]?.name} />
                  <div style={{ fontSize: 13, color: s?.is_day_off ? T.sub : T.ink }}>{s ? (s.is_day_off ? "休" : `${s.start_time?.slice(0, 5)}–${s.end_time?.slice(0, 5)}`) : "尚未排班"}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {showHqSection && (
        <div className="ph-card" style={{ padding: 16, marginTop: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
            <strong style={{ fontSize: 13.5 }}>總部人員排休</strong>
            <span style={{ fontSize: 11.5, color: T.sub }}>僅供檢視，如需異動請洽總部</span>
          </div>
          {hqRoster.length === 0 ? (
            <p style={{ color: T.sub, fontSize: 12.5, margin: 0 }}>總部目前尚無在職人員資料</p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {hqRoster.map((r, idx) => {
                const offDates = hqShifts.filter((s) => s.employee_id === r.id && s.is_day_off).map((s) => Number(s.work_date.slice(8, 10))).sort((a, b) => a - b);
                return (
                  <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 12.5, flexWrap: "wrap" }}>
                    <RosterAvatar name={r.name} index={idx} />
                    <span style={{ fontWeight: 500, minWidth: 70 }}>{r.name}</span>
                    <span style={{ color: T.sub }}>{offDates.length ? `本月排休：${offDates.map((d) => `${d}日`).join("、")}` : "本月尚無排休登記"}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {editing && (
        <ShiftEditModal editing={editing} onClose={() => setEditing(null)} onSave={saveShift} />
      )}
      {publishModal && (
        <Modal title="確認發布班表" onClose={() => setPublishModal(false)}>
          <p style={{ fontSize: 13.5 }}>即將發布 <strong>{ym.slice(0, 4)}年{Number(ym.slice(5, 7))}月</strong>（{scopeName}）班表，所有夥伴都能立即在系統上看到目前的排班內容。</p>
          <p style={{ fontSize: 12.5, color: T.sub }}>※ 系統排班為即改即存，發布為確認留存紀錄，不會另外隱藏未發布的班次。</p>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 8 }}>
            <button className="ph-btn" onClick={() => setPublishModal(false)}>取消</button>
            <button className="ph-btn primary" onClick={confirmPublish}>確認發布</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function ShiftEditModal({ editing, onClose, onSave }) {
  const ex = editing.existing;
  const [isDayOff, setIsDayOff] = useState(ex ? ex.is_day_off : false);
  const [startTime, setStartTime] = useState(ex?.start_time?.slice(0, 5) || "10:00");
  const [endTime, setEndTime] = useState(ex?.end_time?.slice(0, 5) || "19:00");
  const [note, setNote] = useState(ex?.note || "");
  const [busy, setBusy] = useState(false);
  const templates = SHIFT_TEMPLATES[editing.storeName] || [];
  const templateGroups = useMemo(() => {
    const groups = [];
    templates.forEach((t) => {
      let g = groups.find((g) => g.name === t.group);
      if (!g) { g = { name: t.group, items: [] }; groups.push(g); }
      g.items.push(t);
    });
    return groups;
  }, [templates]);

  function applyTemplate(t) {
    setIsDayOff(false);
    setStartTime(t.start);
    setEndTime(t.end);
    setNote(t.label);
  }

  async function handleSave() {
    setBusy(true);
    try {
      await onSave(editing.employeeId, editing.employeeStoreId, editing.date, { startTime, endTime, isDayOff, note });
    } finally {
      setBusy(false);
    }
  }

  return (
    <Modal title={`${editing.employeeName}・${editing.date}`} onClose={onClose}>
      {templateGroups.length > 0 && (
        <Field label="快速套用班別">
          {templateGroups.map((g) => (
            <div key={g.name} style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 11.5, color: T.sub, marginBottom: 4 }}>{g.name}</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {g.items.map((t) => (
                  <button key={t.label} type="button" className="ph-btn small" onClick={() => applyTemplate(t)}
                    title={t.staffing ? `${t.start}–${t.end}（${t.staffing}）` : `${t.start}–${t.end}`}>

                ))}

            </div>
          ))}

      )}

          <div style={{ display: "flex", gap: 8 }}>
            <input className="ph-input" type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} />
            <input className="ph-input" type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} />
          </div>
        )}
      </Field>
      <Field label="備註"><input className="ph-input" value={note} onChange={(e) => setNote(e.target.value)} /></Field>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
        <button className="ph-btn" onClick={onClose} disabled={busy}>取消</button>
        <button className="ph-btn primary" disabled={busy} onClick={handleSave}>{busy ? "儲存中…" : "儲存"}</button>
      </div>
    </Modal>
  );
}

function RequestsPage({ me, stores, storeId, scopeStoreIds, toast }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [decidingId, setDecidingId] = useState(null);
  const [truncated, setTruncated] = useState(false);
  const [typeFilter, setTypeFilter] = useState("all");
  const [statusFilter, setStatusFilter] = useState("all");
  const [monthFilter, setMonthFilter] = useState("");
  const canReview = me.role === "manager" || me.role === "hr";
  const storeById = useMemo(() => Object.fromEntries(stores.map((s) => [s.id, s])), [stores]);

  const load = useCallback(async () => {
    if (!scopeStoreIds.length) { setRows([]); setLoading(false); return; }
    setLoading(true);
    let q = sb.from("requests").select("*, employees!requests_employee_id_fkey(name)").order("submitted_at", { ascending: false }).limit(300);
    if (canReview) q = q.in("store_id", scopeStoreIds);
    else q = q.eq("employee_id", me.id);
    const { data, error } = await q;
    if (error) console.error("requests load", error);
    setRows(data || []);
    setTruncated((data || []).length >= 300);
    setLoading(false);
  }, [scopeStoreIds, canReview, me.id]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const ch = sb.channel("requests_sync").on("postgres_changes", { event: "*", schema: "public", table: "requests" }, () => load()).subscribe();
    return () => sb.removeChannel(ch);
  }, [load]);

  async function decide(id, decision) {
    if (decidingId) return;
    setDecidingId(id);
    try {
      const { error } = await sb.from("requests").update({ status: decision, reviewed_by: me.id, reviewed_at: new Date().toISOString() }).eq("id", id);
      if (error) { toast("操作失敗：" + error.message); return; }
      await logAudit(me.name, decision, `request:${id}`);
      toast(decision === "approved" ? "已核准" : "已拒絕");
    } finally {
      setDecidingId(null);
    }
  }

  const filteredRows = rows.filter((r) => {
    if (typeFilter !== "all" && r.type !== typeFilter) return false;
    if (statusFilter !== "all" && r.status !== statusFilter) return false;
    if (monthFilter && !r.start_at?.startsWith(monthFilter)) return false;
    return true;
  });
  const scopeName = scopeStoreIds.length > 1 ? "ALL STORES" : (storeById[scopeStoreIds[0]]?.name || "");

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <p className="ph-eyebrow" style={{ margin: 0, color: T.brown }}>{scopeName}</p>
          <h2 className="ph-serif" style={{ margin: "2px 0 4px" }}>{canReview ? "待處理申請" : "我的請假／加班申請"}</h2>
          <p style={{ color: T.sub, fontSize: 12.5, margin: 0 }}>{canReview ? "每間門店獨立審核，核准後同步影響該店班表與薪資試算。" : "送出後由店長或人資審核，核准後同步影響班表與薪資試算。"}</p>
        </div>
        <button className="ph-btn primary" onClick={() => setShowForm(true)}>＋ 送出申請</button>
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", margin: "18px 0 14px" }}>
        <select className="ph-input" style={{ width: 130 }} value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)}>
          <option value="all">全部類型</option>
          <option value="annual_leave">特休</option>
          <option value="personal_leave">事假</option>
          <option value="overtime">加班</option>
        </select>
        <select className="ph-input" style={{ width: 130 }} value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
          <option value="all">全部狀態</option>
          <option value="pending">待審核</option>
          <option value="approved">已核准</option>
          <option value="rejected">已拒絕</option>
        </select>
        <input className="ph-input" style={{ width: 150 }} type="month" value={monthFilter} onChange={(e) => setMonthFilter(e.target.value)} />
        {monthFilter && <button className="ph-btn small" onClick={() => setMonthFilter("")}>清除月份</button>}
      </div>
      {truncated && (
        <p style={{ color: T.brown, fontSize: 12.5, marginTop: 0, marginBottom: 10 }}>
          僅顯示最近 300 筆申請，較舊的紀錄未顯示；可用上方月份篩選查詢特定月份。
        </p>
      )}
      {loading ? <p style={{ color: T.sub }}>載入中…</p> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {filteredRows.map((r, idx) => {
            const pill = REQ_TYPE_PILL[r.type];
            return (
              <div key={r.id} className="ph-card" style={{ padding: "16px 18px", display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 190, flex: 1 }}>
                  <RosterAvatar name={r.employees?.name} index={idx} />
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontWeight: 500 }}>{r.employees?.name || "—"}</div>
                    <div style={{ fontSize: 11.5, color: T.sub }}>{storeById[r.store_id]?.name}・{fmtDateTimeShort(r.submitted_at)} 提交</div>
                  </div>
                </div>
                <div style={{ minWidth: 90 }}>
                  <div style={{ fontSize: 11, color: T.sub, marginBottom: 4 }}>申請類型</div>
                  <span className="ph-badge" style={{ background: pill.bg, color: pill.fg, fontWeight: 600 }}>{REQ_TYPE_LABEL[r.type]}</span>
                  {r.type === "overtime" && r.overtime_type && (
                    <div style={{ fontSize: 11, color: T.sub, marginTop: 4 }}>{OVERTIME_TYPE_LABEL[r.overtime_type]}</div>
                  )}
                </div>
                <div style={{ minWidth: 110 }}>
                  <div style={{ fontSize: 11, color: T.sub, marginBottom: 4 }}>日期</div>
                  <div style={{ fontWeight: 600, fontSize: 13.5 }}>{fmtDateShort(r.start_at)}</div>
                </div>
                <div style={{ minWidth: 70 }}>
                  <div style={{ fontSize: 11, color: T.sub, marginBottom: 4 }}>時數</div>
                  <div style={{ fontWeight: 600, fontSize: 13.5 }}>{r.hours} 小時</div>
                </div>
                <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
                  {r.status === "pending" && canReview ? (
                    <>
                      <button className="ph-btn small" disabled={decidingId === r.id} onClick={() => decide(r.id, "rejected")}>退回</button>
                      <button className="ph-btn small" style={{ background: T.olive, borderColor: T.olive, color: "#fff" }} disabled={decidingId === r.id} onClick={() => decide(r.id, "approved")}>{decidingId === r.id ? "處理中…" : "核准"}</button>
                    </>
                  ) : (
                    <Badge tone={r.status === "approved" ? "green" : r.status === "rejected" ? "red" : "yellow"}>{REQ_STATUS_LABEL[r.status]}</Badge>
                  )}
                </div>
              </div>
            );
          })}
          {filteredRows.length === 0 && <div className="ph-card" style={{ padding: 24, color: T.sub, textAlign: "center" }}>沒有符合條件的紀錄</div>}
        </div>
      )}
      {showForm && <RequestFormModal me={me} storeId={storeId} onClose={() => setShowForm(false)} onSaved={() => { setShowForm(false); load(); toast("已送出申請"); }} />}
    </div>
  );
}

const OVERTIME_TYPE_LABEL = {
  workday: "平日加班",
  rest_day: "休息日加班",
  holiday: "國定假日／特別休假出勤",
  statutory_rest: "例假出勤（天災／事變／突發事件）",
};

function RequestFormModal({ me, storeId, onClose, onSaved }) {
  const [type, setType] = useState("annual_leave");
  const [overtimeType, setOvertimeType] = useState("workday");
  const [date, setDate] = useState(todayStr());
  const [startTime, setStartTime] = useState("09:00");
  const [endTime, setEndTime] = useState("18:00");
  const [reason, setReason] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit() {
    setErr("");
    const startAt = `${date}T${startTime}:00+08:00`;
    const endAt = `${date}T${endTime}:00+08:00`;
    const hours = (new Date(endAt) - new Date(startAt)) / 3600000;
    if (!(hours > 0)) { setErr("結束時間須晚於開始時間"); return; }
    if (!isHalfHourStep(hours)) { setErr("時數須為 0.5 小時單位"); return; }
    if (!reason.trim()) { setErr("請填寫事由"); return; }
    setBusy(true);
    const { error } = await sb.from("requests").insert({
      employee_id: me.id, store_id: storeId, type, start_at: startAt, end_at: endAt, hours, reason: reason.trim(),
      overtime_type: type === "overtime" ? overtimeType : null,
    });
    setBusy(false);
    if (error) { setErr(error.message.includes("row-level security") ? "此月份薪資已鎖定，無法送出" : error.message); return; }
    await logAudit(me.name, "submit_request", type);
    onSaved();
  }

  return (
    <Modal title="送出請假／加班申請" onClose={onClose}>
      <Field label="類型">
        <select className="ph-input" value={type} onChange={(e) => setType(e.target.value)}>
          <option value="annual_leave">特休</option>
          <option value="personal_leave">事假</option>
          <option value="overtime">加班</option>
        </select>
      </Field>
      {type === "overtime" && (
        <Field label="加班類型（依勞基法計算加班費）">
          <select className="ph-input" value={overtimeType} onChange={(e) => setOvertimeType(e.target.value)}>
            {Object.entries(OVERTIME_TYPE_LABEL).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </Field>
      )}
      <Field label="日期"><input className="ph-input" type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <div style={{ display: "flex", gap: 8 }}>
        <Field label="開始時間"><input className="ph-input" type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} /></Field>
        <Field label="結束時間"><input className="ph-input" type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} /></Field>
      </div>
      <Field label="事由"><textarea className="ph-input" rows={2} value={reason} onChange={(e) => setReason(e.target.value)} /></Field>
      {err && <div className="ph-err">{err}</div>}
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
        <button className="ph-btn" onClick={onClose}>取消</button>
        <button className="ph-btn primary" disabled={busy} onClick={submit}>{busy ? "送出中…" : "送出"}</button>
      </div>
    </Modal>
  );
}

const DAILY_HUB_LABEL = { missing: "未繳交", submitted: "已提交", signed: "已提交", hr_received: "已提交", needs_attach: "需補件" };
const DAILY_HUB_TONE = { missing: "sub", submitted: "olive", signed: "olive", hr_received: "olive", needs_attach: "red" };

function DailyReportPage({ me, stores, scopeStoreIds, toast }) {
  const [date, setDate] = useState(todayStr());
  const [reports, setReports] = useState([]);
  const [anomalyCounts, setAnomalyCounts] = useState({});
  const [attachCounts, setAttachCounts] = useState({});
  const [nameById, setNameById] = useState({});
  const [loading, setLoading] = useState(true);
  const [openStoreId, setOpenStoreId] = useState(null);

  const storeById = useMemo(() => Object.fromEntries(stores.map((s) => [s.id, s])), [stores]);
  const visibleStores = stores.filter((s) => scopeStoreIds.includes(s.id));

  const load = useCallback(async () => {
    if (!scopeStoreIds.length) return;
    setLoading(true);
    const repRes = await sb.from("daily_reports").select("*").in("store_id", scopeStoreIds).eq("report_date", date);
    if (repRes.error) console.error("daily_reports", repRes.error);
    const reps = repRes.data || [];
    setReports(reps);
    const reportIds = reps.map((r) => r.id);
    const empIds = [...new Set(reps.flatMap((r) => [r.submitted_by, r.signed_by, r.hr_received_by]).filter(Boolean))];
    const [entriesRes, attachRes, empRes] = await Promise.all([
      reportIds.length ? sb.from("daily_report_entries").select("daily_report_id,late,missed_punch,leave,overtime") .in("daily_report_id", reportIds) : Promise.resolve({ data: [] }),
      reportIds.length ? sb.from("daily_report_attachments").select("daily_report_id").in("daily_report_id", reportIds) : Promise.resolve({ data: [] }),
      empIds.length ? sb.from("employees").select("id,name").in("id", empIds) : Promise.resolve({ data: [] }),
    ]);
    const aCounts = {};
    (entriesRes.data || []).forEach((e) => {
      if (e.late || e.missed_punch || e.leave || e.overtime) aCounts[e.daily_report_id] = (aCounts[e.daily_report_id] || 0) + 1;
    });
    const fCounts = {};
    (attachRes.data || []).forEach((a) => { fCounts[a.daily_report_id] = (fCounts[a.daily_report_id] || 0) + 1; });
    setAnomalyCounts(aCounts);
    setAttachCounts(fCounts);
    setNameById(Object.fromEntries((empRes.data || []).map((e) => [e.id, e.name])));
    setLoading(false);
  }, [scopeStoreIds, date]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const ch = sb.channel("daily_report_hub_sync")
      .on("postgres_changes", { event: "*", schema: "public", table: "daily_reports" }, load)
      .on("postgres_changes", { event: "*", schema: "public", table: "daily_report_entries" }, load)
      .on("postgres_changes", { event: "*", schema: "public", table: "daily_report_attachments" }, load)
      .subscribe();
    return () => sb.removeChannel(ch);
  }, [load]);

  if (openStoreId) {
    const store = storeById[openStoreId];
    return <DailyReportDetail me={me} store={store} date={date} onDateChange={setDate} toast={toast} onBack={() => setOpenStoreId(null)} />;
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <p className="ph-eyebrow" style={{ margin: 0, color: T.brown }}>DAILY OPERATIONS REPORT</p>
          <h2 className="ph-serif" style={{ margin: "2px 0 4px" }}>每日異常回報</h2>
          <p style={{ color: T.sub, fontSize: 12.5, margin: 0 }}>本頁為正式電子日總表，完整取代紙本；無論有無異常，每間門店每天都要完成。</p>
        </div>
        <label style={{ fontSize: 12.5, color: T.sub }}>
          回報日期<br />
          <input className="ph-input" style={{ width: 160, marginTop: 4 }} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </label>
      </div>
      <div style={{ marginTop: 18 }} />
      {loading ? <p style={{ color: T.sub }}>載入中…</p> : visibleStores.length === 0 ? (
        <p style={{ color: T.sub, textAlign: "center", padding: "24px 0" }}>沒有可查看的門市</p>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(280px,1fr))", gap: 16 }}>
          {visibleStores.map((s) => {
            const rep = reports.find((r) => r.store_id === s.id);
            const anomalyCount = rep ? (anomalyCounts[rep.id] || 0) : 0;
            const attachCount = rep ? (attachCounts[rep.id] || 0) : 0;
            const needsAttach = !!rep && anomalyCount > 0 && attachCount === 0;
            const key = !rep ? "missing" : needsAttach ? "needs_attach" : rep.status;
            const submitterName = rep?.submitted_by ? nameById[rep.submitted_by] : null;
            return (
              <div key={s.id} className="ph-card" style={{ padding: 18, cursor: "pointer" }} onClick={() => setOpenStoreId(s.id)}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                  <h3 className="ph-serif" style={{ margin: 0, fontSize: 16, display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ width: 7, height: 7, borderRadius: "999px", background: T[DAILY_HUB_TONE[key]], flexShrink: 0 }} />
                    {s.name}
                  </h3>
                  <Badge tone={DAILY_HUB_TONE[key]}>{DAILY_HUB_LABEL[key]}</Badge>
                </div>
                <p style={{ fontSize: 13, color: T.sub, margin: "0 0 6px" }}>{anomalyCount} 位夥伴有異常紀錄</p>
                {rep ? (
                  <p style={{ fontSize: 12, color: T.sub, margin: "0 0 14px" }}>
                    提交人：{submitterName || "—"}　提交時間：{rep.submitted_at ? fmtTaipei(rep.submitted_at) : "—"}
                  </p>
                ) : (
                  <p style={{ fontSize: 12, color: T.sub, margin: "0 0 14px" }}>今日尚未送出每日回報</p>
                )}
                <button className="ph-btn small primary" onClick={(e) => { e.stopPropagation(); setOpenStoreId(s.id); }}>
                  {rep ? "查看回報 →" : "前往填寫 →"}
                </button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function DailyReportDetail({ me, store, date, onDateChange, toast, onBack }) {
  const storeId = store?.id;
  const [roster, setRoster] = useState([]);
  const [report, setReport] = useState(null);
  const [entries, setEntries] = useState({}); // employeeId -> entry draft
  const [attachments, setAttachments] = useState([]);
  const [posVerified, setPosVerified] = useState(false);
  const [loading, setLoading] = useState(true);
  const [attachmentsComplete, setAttachmentsComplete] = useState(false);
  const [actionBusy, setActionBusy] = useState(false);

  const load = useCallback(async () => {
    if (!storeId) return;
    setLoading(true);
    const [rosterRes, reportRes] = await Promise.all([
      sb.rpc("store_roster", { p_store_id: storeId }),
      sb.from("daily_reports").select("*").eq("store_id", storeId).eq("report_date", date).maybeSingle(),
    ]);
    if (rosterRes.error) console.error("store_roster", rosterRes.error);
    if (reportRes.error) console.error("daily_reports", reportRes.error);
    const rosterActive = (rosterRes.data || []).filter((r) => r.active);
    setRoster(rosterActive);
    const rep = reportRes.data;
    setReport(rep);
    setPosVerified(rep?.pos_verified || false);
    let entryMap = {};
    let attachRows = [];
    if (rep) {
      const [entriesRes, attachRes] = await Promise.all([
        sb.from("daily_report_entries").select("*").eq("daily_report_id", rep.id),
        sb.from("daily_report_attachments").select("*").eq("daily_report_id", rep.id),
      ]);
      (entriesRes.data || []).forEach((e) => { entryMap[e.employee_id] = e; });
      attachRows = attachRes.data || [];
    }
    const draft = {};
    rosterActive.forEach((r) => {
      const e = entryMap[r.id];
      draft[r.id] = e ? { ...e } : { late: false, missed_punch: false, leave: false, overtime: false, overtime_hours: "", reason: "", improvement: "", note: "" };
    });
    setEntries(draft);
    setAttachments(attachRows);
    setLoading(false);
  }, [storeId, date]);

  useEffect(() => { load(); }, [load]);

  const hasAnomaly = Object.values(entries).some((e) => e.late || e.missed_punch || e.leave || e.overtime);
  const canWrite = (me.role === "manager" || me.role === "hr") && (!report || report.status === "draft" || report.status === "submitted");

  function updateEntry(employeeId, patch) {
    setEntries((prev) => ({ ...prev, [employeeId]: { ...prev[employeeId], ...patch } }));
  }

  async function submitReport() {
    if (actionBusy) return;
    if (!posVerified) { toast("請先勾選已完成 POS 出缺勤與加班核對"); return; }
    for (const r of roster) {
      const e = entries[r.id];
      const anomaly = e.late || e.missed_punch || e.leave || e.overtime;
      if (anomaly && !e.reason?.trim()) { toast(`${r.name}的異常須填寫「其他異常／補充」說明`); return; }
      if (e.overtime && !isHalfHourStep(Number(e.overtime_hours))) { toast(`${r.name}的加班時數須以 0.5 小時為單位`); return; }
    }
    setActionBusy(true);
    try {
      let reportId = report?.id;
      if (!reportId) {
        const { data, error } = await sb.from("daily_reports").insert({ store_id: storeId, report_date: date, status: "submitted", pos_verified: true, submitted_by: me.id, submitted_at: new Date().toISOString() }).select().single();
        if (error) { toast("送出失敗：" + error.message); return; }
        reportId = data.id;
      } else {
        const { error } = await sb.from("daily_reports").update({ status: "submitted", pos_verified: true, submitted_by: me.id, submitted_at: new Date().toISOString(), signed_by: null, signed_at: null }).eq("id", reportId);
        if (error) { toast("送出失敗：" + error.message); return; }
      }
      for (const r of roster) {
        const e = entries[r.id];
        await sb.from("daily_report_entries").upsert({
          daily_report_id: reportId, store_id: storeId, employee_id: r.id,
          late: e.late, missed_punch: e.missed_punch, leave: e.leave, overtime: e.overtime,
          overtime_hours: e.overtime ? Number(e.overtime_hours) : null,
          reason: e.reason || "", improvement: e.improvement || "", note: e.note || "",
        }, { onConflict: "daily_report_id,employee_id" });
      }
      await logAudit(me.name, "submit_daily_report", `${storeId}:${date}`);
      toast("已送出，等待領班簽核");
      load();
    } finally {
      setActionBusy(false);
    }
  }

  async function signReport() {
    if (actionBusy) return;
    if (hasAnomaly && (!attachments.length || !attachmentsComplete)) { toast("請先上傳所有相關附件並勾選確認"); return; }
    setActionBusy(true);
    try {
      const { error } = await sb.from("daily_reports").update({ status: "signed", signed_by: me.id, signed_at: new Date().toISOString() }).eq("id", report.id);
      if (error) { toast("簽核失敗：" + error.message); return; }
      await logAudit(me.name, "sign_daily_report", report.id);
      toast("已完成領班簽核");
      load();
    } finally {
      setActionBusy(false);
    }
  }

  async function handoffReport() {
    if (actionBusy) return;
    setActionBusy(true);
    try {
      const { error } = await sb.from("daily_reports").update({ status: "hr_received", hr_received_by: me.id, hr_received_at: new Date().toISOString() }).eq("id", report.id);
      if (error) { toast("交接失敗：" + error.message); return; }
      await logAudit(me.name, "handoff_daily_report", report.id);
      toast("已完成人資交接");
      load();
    } finally {
      setActionBusy(false);
    }
  }

  async function uploadFile(file) {
    if (file.size > 10 * 1024 * 1024) { toast("單檔上限 10MB"); return; }
    let reportId = report?.id;
    if (!reportId) {
      const { data, error } = await sb.from("daily_reports").insert({ store_id: storeId, report_date: date, status: "draft" }).select().single();
      if (error) { toast("建立日總表失敗：" + error.message); return; }
      reportId = data.id;
    }
    const path = `${reportId}/${Date.now()}_${file.name}`;
    const { error: upErr } = await sb.storage.from("daily-report-attachments").upload(path, file);
    if (upErr) { toast("上傳失敗：" + upErr.message); return; }
    const { error } = await sb.from("daily_report_attachments").insert({
      daily_report_id: reportId, store_id: storeId, storage_path: path, file_name: file.name, file_size: file.size, mime_type: file.type || "application/octet-stream", uploaded_by: me.id,
    });
    if (error) { toast("附件登錄失敗：" + error.message); return; }
    load();
  }

  const anomalyCount = roster.filter((r) => {
    const e = entries[r.id] || {};
    return e.late || e.missed_punch || e.leave || e.overtime;
  }).length;
  const signDone = report?.status === "signed" || report?.status === "hr_received";
  const handoffDone = report?.status === "hr_received";

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 4 }}>
        <div>
          <button className="ph-btn small" style={{ marginBottom: 10 }} onClick={onBack}>← 返回每日回報</button>
          <p className="ph-eyebrow" style={{ margin: 0 }}>DAILY OPERATIONS REPORT</p>
          <h2 className="ph-serif" style={{ margin: "2px 0 4px" }}>每日異常回報</h2>
          <p style={{ color: T.sub, fontSize: 12.5, margin: 0 }}>本頁為正式電子日總表，完整取代紙本；無論有無異常，每間門店每天都要完成。</p>
        </div>
        <label style={{ fontSize: 12.5, color: T.sub }}>
          回報日期<br />
          <input className="ph-input" style={{ width: 160, marginTop: 4 }} type="date" value={date} onChange={(e) => onDateChange(e.target.value)} />
        </label>
      </div>

      {!loading && (
        <div className="ph-card" style={{ padding: "14px 18px", margin: "16px 0", display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(120px,1fr))", gap: 12 }}>
          <div><p style={{ fontSize: 12, color: T.sub, margin: "0 0 4px" }}>處理門店</p><p style={{ fontWeight: 600, margin: 0 }}>{store?.name}</p></div>
          <div><p style={{ fontSize: 12, color: T.sub, margin: "0 0 4px" }}>POS 核對</p><p style={{ fontWeight: 600, margin: 0, color: posVerified ? T.green : T.brown }}>{posVerified ? "已確認" : "待確認"}</p></div>
          <div><p style={{ fontSize: 12, color: T.sub, margin: "0 0 4px" }}>異常人數</p><p style={{ fontWeight: 600, margin: 0 }}>{anomalyCount} 人</p></div>
          <div><p style={{ fontSize: 12, color: T.sub, margin: "0 0 4px" }}>領班簽核</p><p style={{ fontWeight: 600, margin: 0, color: signDone ? T.green : T.brown }}>{signDone ? "已完成" : "尚未完成"}</p></div>
          <div><p style={{ fontSize: 12, color: T.sub, margin: "0 0 4px" }}>人資交接</p><p style={{ fontWeight: 600, margin: 0, color: handoffDone ? T.green : T.brown }}>{handoffDone ? "已完成" : "未繳交"}</p></div>
        </div>
      )}

      {loading ? <p style={{ color: T.sub }}>載入中…</p> : (
        <>
          <div className="ph-card" style={{ padding: 16, marginBottom: 14 }}>
            <label style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
              <input type="checkbox" style={{ marginTop: 3 }} disabled={!canWrite} checked={posVerified} onChange={(e) => setPosVerified(e.target.checked)} />
              <span>
                <strong>已完成 POS 出缺勤核對</strong>
                <p style={{ color: T.sub, fontSize: 12.5, margin: "2px 0 0" }}>領班已核對當日所有夥伴的打卡、漏打卡、請假與實際加班紀錄。</p>
              </span>
            </label>
          </div>

          <div className="ph-card" style={{ padding: 0, marginBottom: 14, overflow: "hidden" }}>
            <div className="ph-schedule-preview-desktop" style={{ overflowX: "auto" }}>
              <table className="ph-table">
                <thead><tr><th>姓名</th><th>遲到</th><th>漏打卡</th><th>請假</th><th>加班</th><th>其他異常／補充</th></tr></thead>
                <tbody>
                  {roster.map((r, idx) => {
                    const e = entries[r.id] || {};
                    const dis = !canWrite;
                    const anomaly = e.late || e.missed_punch || e.leave || e.overtime;
                    return (
                      <tr key={r.id}>
                        <td><RosterCell r={r} index={idx} /></td>
                        <td><input type="checkbox" disabled={dis} checked={!!e.late} onChange={(ev) => updateEntry(r.id, { late: ev.target.checked })} /></td>
                        <td><input type="checkbox" disabled={dis} checked={!!e.missed_punch} onChange={(ev) => updateEntry(r.id, { missed_punch: ev.target.checked })} /></td>
                        <td><input type="checkbox" disabled={dis} checked={!!e.leave} onChange={(ev) => updateEntry(r.id, { leave: ev.target.checked })} /></td>
                        <td><input type="checkbox" disabled={dis} checked={!!e.overtime} onChange={(ev) => updateEntry(r.id, { overtime: ev.target.checked })} /></td>
                        <td style={{ minWidth: 240 }}>
                          {e.overtime && (
                            <input className="ph-input" style={{ width: 90, marginBottom: 6 }} type="number" step="0.5" min="0.5" placeholder="加班時數"
                              disabled={dis} value={e.overtime_hours} onChange={(ev) => updateEntry(r.id, { overtime_hours: ev.target.value })} />
                          )}
                          <textarea className="ph-input" rows={2} disabled={dis} placeholder="設備、客訴或其他營運異常…"
                            value={e.reason || ""} onChange={(ev) => updateEntry(r.id, { reason: ev.target.value, improvement: ev.target.value })}
                            style={anomaly && !e.reason?.trim() ? { borderColor: T.red } : undefined} />
                        </td>
                      </tr>
                    );
                  })}
                  {roster.length === 0 && <tr><td colSpan={6} style={{ color: T.sub, textAlign: "center" }}>此門市尚無在職夥伴</td></tr>}
                </tbody>
              </table>
            </div>
            <div className="ph-schedule-preview-mobile" style={{ padding: 14 }}>
              {roster.map((r, idx) => {
                const e = entries[r.id] || {};
                const dis = !canWrite;
                const anomaly = e.late || e.missed_punch || e.leave || e.overtime;
                return (
                  <div key={r.id} style={{ padding: "12px 0", borderBottom: `1px solid ${T.line}` }}>
                    <RosterCell r={r} index={idx} />
                    <div style={{ display: "flex", gap: 14, margin: "10px 0" }}>
                      <label style={{ display: "flex", gap: 5, alignItems: "center", fontSize: 12.5 }}><input type="checkbox" disabled={dis} checked={!!e.late} onChange={(ev) => updateEntry(r.id, { late: ev.target.checked })} /> 遲到</label>
                      <label style={{ display: "flex", gap: 5, alignItems: "center", fontSize: 12.5 }}><input type="checkbox" disabled={dis} checked={!!e.missed_punch} onChange={(ev) => updateEntry(r.id, { missed_punch: ev.target.checked })} /> 漏打卡</label>
                      <label style={{ display: "flex", gap: 5, alignItems: "center", fontSize: 12.5 }}><input type="checkbox" disabled={dis} checked={!!e.leave} onChange={(ev) => updateEntry(r.id, { leave: ev.target.checked })} /> 請假</label>
                      <label style={{ display: "flex", gap: 5, alignItems: "center", fontSize: 12.5 }}><input type="checkbox" disabled={dis} checked={!!e.overtime} onChange={(ev) => updateEntry(r.id, { overtime: ev.target.checked })} /> 加班</label>
                    </div>
                    {e.overtime && (
                      <input className="ph-input" style={{ width: 90, marginBottom: 6 }} type="number" step="0.5" min="0.5" placeholder="加班時數"
                        disabled={dis} value={e.overtime_hours} onChange={(ev) => updateEntry(r.id, { overtime_hours: ev.target.value })} />
                    )}
                    <textarea className="ph-input" rows={2} disabled={dis} placeholder="設備、客訴或其他營運異常…"
                      value={e.reason || ""} onChange={(ev) => updateEntry(r.id, { reason: ev.target.value, improvement: ev.target.value })}
                      style={anomaly && !e.reason?.trim() ? { borderColor: T.red } : undefined} />
                  </div>
                );
              })}
            </div>
          </div>

          <div className="ph-card" style={{ padding: 16, marginBottom: 14 }}>
            <strong style={{ fontSize: 13 }}>相關附件</strong>
            <p style={{ color: T.sub, fontSize: 12, margin: "4px 0 10px" }}>漏打卡、請假或加班須上傳相關補單、加班單或證明；支援 PDF 與圖片，單檔上限 10MB。</p>
            {!report?.id && !canWrite ? (
              <p style={{ color: T.sub, fontSize: 12.5, background: T.bg, padding: "8px 12px", borderRadius: 6 }}>目前尚無日總表資料。</p>
            ) : (
              <>
                {attachments.length === 0 && <p style={{ color: T.sub, fontSize: 12.5 }}>{hasAnomaly ? "目前沒有附件，簽核前必須上傳" : "目前沒有附件"}</p>}
                <ul style={{ fontSize: 12.5, paddingLeft: 18 }}>
                  {attachments.map((a) => <li key={a.id}>{a.file_name}（{(a.file_size / 1024).toFixed(0)}KB）</li>)}
                </ul>
                {canWrite && <input type="file" accept="application/pdf,image/*" onChange={(e) => e.target.files[0] && uploadFile(e.target.files[0])} />}
                {hasAnomaly && (
                  <label style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8, fontSize: 12.5 }}>
                    <input type="checkbox" checked={attachmentsComplete} onChange={(e) => setAttachmentsComplete(e.target.checked)} disabled={report?.status !== "submitted" || (me.role !== "manager" && me.role !== "hr")} />
                    確認附件已完整上傳
                  </label>
                )}
              </>
            )}
          </div>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
            <p style={{ color: T.brown, fontSize: 12, margin: 0, maxWidth: 480 }}>
              <strong>正式電子日總表：</strong>完成 POS 核對、異常內容、附件、領班簽核與人資交接後，即完成當日流程，不再另填紙本。
            </p>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {(!report || report.status === "draft" || report.status === "submitted") && canWrite && !hasAnomaly && (
                <button className="ph-btn" disabled={actionBusy} onClick={submitReport}>今日無異常，直接送出</button>
              )}
              {(!report || report.status === "draft" || report.status === "submitted") && canWrite && (
                <button className="ph-btn primary" disabled={actionBusy} onClick={submitReport}>{actionBusy ? "處理中…" : "儲存並送出"}</button>
              )}
              {report?.status === "submitted" && canWrite && (
                <button className="ph-btn primary" disabled={actionBusy} onClick={signReport}>{actionBusy ? "處理中…" : "領班簽核"}</button>
              )}
              {report?.status === "signed" && me.role === "hr" && (
                <button className="ph-btn primary" disabled={actionBusy} onClick={handoffReport}>{actionBusy ? "處理中…" : "確認人資交接"}</button>
              )}
              {report?.status === "signed" && me.role !== "hr" && <span style={{ color: T.sub, fontSize: 12.5 }}>✓ 已完成領班簽核，等待人資交接</span>}
              {report?.status === "hr_received" && <span style={{ color: T.green, fontSize: 12.5 }}>✓ 領班與人資流程皆已完成</span>}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

const COMPANY_NAME_BY_STORE = {
  "中山店": "耿將食品有限公司",
  "水湳店": "森揚餐坊股份有限公司",
  "勤美店": "宏楷餐飲有限公司",
};
function companyNameForStore(storeName) {
  return COMPANY_NAME_BY_STORE[storeName] || "耿將食品有限公司";
}

function PayslipRow({ label, value, strong }) {
  return (
    <tr>
      <td>{label}</td>
      <td className="num" style={strong ? { fontWeight: 700, fontSize: 15 } : undefined}>NT$ {money(value)}</td>
    </tr>
  );
}
function PayslipSection({ title }) {
  return <tr><td colSpan={2} style={{ background: "#F5F1EA", fontWeight: 600 }}>{title}</td></tr>;
}

function AdjustmentsModal({ me, emp, storeId, ym, items, locked, onClose, toast }) {
  const blankRow = () => ({ key: Math.random().toString(36).slice(2), label: "", amount: "", taxable: true });
  const [drafts, setDrafts] = useState([blankRow()]);
  const [busy, setBusy] = useState(false);

  function updateDraft(key, patch) {
    setDrafts((rows) => rows.map((r) => (r.key === key ? { ...r, ...patch } : r)));
  }

  function addRow() {
    setDrafts((rows) => [...rows, blankRow()]);
  }

  function removeRow(key) {
    setDrafts((rows) => (rows.length > 1 ? rows.filter((r) => r.key !== key) : rows));
  }

  async function saveAll() {
    const filled = drafts.filter((r) => r.label.trim() || r.amount !== "");
    if (filled.length === 0) { toast("請至少填寫一列項目"); return; }
    for (const r of filled) {
      if (!r.label.trim()) { toast("請輸入項目名稱"); return; }
      if (r.amount === "" || Number.isNaN(Number(r.amount)) || Number(r.amount) === 0) { toast("請輸入金額"); return; }
    }
    setBusy(true);
    try {
      const rows = filled.map((r) => ({
        employee_id: emp.id, store_id: storeId, year_month: ym, label: r.label.trim(), amount: Number(r.amount), taxable: r.taxable,
      }));
      const { error } = await sb.from("payroll_adjustments").insert(rows);
      if (error) { toast("新增失敗：" + (error.message.includes("row-level security") ? "此月份薪資已鎖定" : error.message)); return; }
      await logAudit(me.name, "add_payroll_adjustment", `${emp.id}:${ym}`, rows.map((r) => `${r.label} ${r.amount}`).join("、"));
      toast(`已新增 ${rows.length} 筆調整項`);
      setDrafts([blankRow()]);
    } finally {
      setBusy(false);
    }
  }

  async function removeItem(id) {
    const { error } = await sb.from("payroll_adjustments").delete().eq("id", id);
    if (error) { toast("刪除失敗：" + error.message); return; }
    await logAudit(me.name, "remove_payroll_adjustment", id);
  }

  return (
    <Modal title={`本月調整項・${emp.name}`} onClose={onClose}>
      <p style={{ color: T.sub, fontSize: 12.5, marginTop: -6, marginBottom: 12 }}>
        用於三節獎金、年終獎金等單月才有的加項（也可填負數作為單月扣款）。金額會計入本月「應發總額」，預設計入應稅所得，非應稅項目可取消勾選。
      </p>
      {items.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          {items.map((a) => (
            <div key={a.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${T.line}` }}>
              <div>
                <div style={{ fontSize: 13.5 }}>{a.label}{!a.taxable && <span style={{ color: T.sub, fontSize: 11.5 }}>（免稅）</span>}</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontWeight: 600 }}>NT$ {money(a.amount)}</span>
                {!locked && <button className="ph-btn small danger" onClick={() => removeItem(a.id)}>刪除</button>}
              </div>
            </div>
          ))}
        </div>
      )}
      {!locked ? (
        <>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
            {drafts.map((r, i) => (
              <div key={r.key} style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <span style={{ fontSize: 12, color: T.sub, width: 46, flexShrink: 0 }}>項目{i + 1}</span>
                <input className="ph-input" style={{ flex: 2 }} placeholder="例：端午禮金" value={r.label} onChange={(e) => updateDraft(r.key, { label: e.target.value })} />
                <input className="ph-input" style={{ flex: 1 }} type="number" placeholder="金額" value={r.amount} onChange={(e) => updateDraft(r.key, { amount: e.target.value })} />
                <label style={{ display: "flex", gap: 4, alignItems: "center", fontSize: 11.5, color: T.sub, flexShrink: 0, whiteSpace: "nowrap" }}>
                  <input type="checkbox" checked={r.taxable} onChange={(e) => updateDraft(r.key, { taxable: e.target.checked })} /> 應稅
                </label>
                <button className="ph-btn small danger" disabled={drafts.length === 1} onClick={() => removeRow(r.key)} style={{ flexShrink: 0, opacity: drafts.length === 1 ? 0.35 : 1 }}>移除</button>
              </div>
            ))}
          </div>
          <p style={{ color: T.sub, fontSize: 12, marginTop: -2, marginBottom: 12 }}>金額可填負數作為單月扣款；未填寫的空白列儲存時會自動略過。</p>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
            <button className="ph-btn" onClick={addRow}>＋ 再加一列</button>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="ph-btn" onClick={onClose}>關閉</button>
              <button className="ph-btn primary" disabled={busy} onClick={saveAll}>{busy ? "儲存中…" : "全部儲存"}</button>
            </div>
          </div>
        </>
      ) : (
        <p style={{ color: T.sub, fontSize: 12.5 }}>此月份薪資已鎖定，無法新增或刪除調整項。</p>
      )}
    </Modal>
  );
}

function PayslipModal({ store, ym, periodLabel, row, onClose }) {
  const [payDate, setPayDate] = useState(todayStr());
  return (
    <div className="ph-modal-backdrop" onMouseDown={() => onClose()}>
      <div className="ph-modal" style={{ maxWidth: 760, padding: 0 }} onMouseDown={(e) => e.stopPropagation()}>
        <div className="ph-payslip-noprint" style={{ display: "flex", justifyContent: "flex-end", gap: 8, padding: 16, borderBottom: `1px solid ${T.line}` }}>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: T.sub, marginRight: "auto" }}>
            薪資發放日期
            <input className="ph-input" style={{ width: 150 }} type="date" value={payDate} onChange={(e) => setPayDate(e.target.value)} />

        <div className="ph-payslip">
