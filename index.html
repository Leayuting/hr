          <h2>員工薪資明細表</h2>
          <table>
            <tbody>
              <tr><th>薪資發放名稱</th><td>{ym.slice(0, 4)}年{Number(ym.slice(5, 7))}月份月薪</td></tr>
              <tr><th>門市</th><td>{store?.name}</td></tr>
              <tr><th>員工姓名</th><td>{row.emp.name}</td></tr>
              <tr><th>到職日</th><td>{row.emp.hire_date || "—"}</td></tr>
              <tr><th>計薪方式</th><td>{row.emp.employment_type === "full_time" ? "月薪" : "時薪"}</td></tr>
              <tr><th>薪資計算區間</th><td>{periodLabel}</td></tr>
              <tr><th>薪資發放日期</th><td>{payDate}</td></tr>
            </tbody>
          </table>
          <table>
            <tbody>
              <PayslipSection title="薪資結構" />
              <PayslipRow label="基本薪資" value={row.basePay} />
              <PayslipRow label="伙食費" value={row.mealAllowance} />
              <PayslipRow label="職務津貼" value={row.positionAllowance} />
              <PayslipSection title="薪資科目加項" />
              <PayslipRow label="加班費" value={row.overtimePay} />
              <PayslipRow label="全勤獎金" value={row.fullAttendanceBonus} />
              {row.empAdjustments.filter((a) => Number(a.amount) > 0).map((a) => (
                <PayslipRow key={a.id} label={a.label + (a.taxable ? "" : "（免稅）")} value={a.amount} />
              ))}
              <PayslipSection title="薪資科目扣項" />
              {row.empAdjustments.filter((a) => Number(a.amount) < 0).map((a) => (
                <PayslipRow key={a.id} label={a.label} value={-a.amount} />
              ))}
              <PayslipRow label="遲到／請假／曠職" value={row.attendanceDeduction} />
              <PayslipRow label="勞保費" value={row.laborInsuranceFee} />
              <PayslipRow label="健保費" value={row.healthInsuranceFee} />
              <PayslipRow label="所得稅" value={row.incomeTax} />
              <PayslipSection title="薪資總計" />
              <PayslipRow label="應稅所得" value={row.taxableIncome} />
              <PayslipRow label="應發總額" value={row.grossPay} />
              <PayslipRow label="應減總額" value={row.totalDeduction} />
              <PayslipRow label="實發金額" value={row.total} strong />
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function PayrollPage({ me, stores, scope, scopeStoreIds, activeStoreId, setScope, toast }) {
  const [ym, setYm] = useState(thisMonthStr());
  const [roster, setRoster] = useState([]);
  const [shifts, setShifts] = useState([]);
  const [requests, setRequests] = useState([]);
  const [runs, setRuns] = useState([]);
  const [adjustments, setAdjustments] = useState([]);
  const [lockBusy, setLockBusy] = useState(false);
  const [payslipRow, setPayslipRow] = useState(null);
  const [adjustingEmp, setAdjustingEmp] = useState(null);
  const [loading, setLoading] = useState(true);
  const storeById = useMemo(() => Object.fromEntries(stores.map((s) => [s.id, s])), [stores]);

  const load = useCallback(async () => {
    if (!scopeStoreIds.length) return;
    setLoading(true);
    const days = monthDays(ym);
    const from = `${ym}-01`, to = `${ym}-${pad2(days)}`;
    const [empRes, shiftRes, reqRes, runRes, adjRes] = await Promise.all([
      sb.from("employees").select("*").in("store_id", scopeStoreIds).eq("active", true).order("name"),
      sb.from("shifts").select("*").in("store_id", scopeStoreIds).gte("work_date", from).lte("work_date", to),
      sb.from("requests").select("*").in("store_id", scopeStoreIds).eq("status", "approved").gte("start_at", `${from}T00:00:00+08:00`).lte("start_at", `${to}T23:59:59+08:00`),
      sb.from("payroll_runs").select("*").in("store_id", scopeStoreIds).eq("year_month", ym),
      sb.from("payroll_adjustments").select("*").in("store_id", scopeStoreIds).eq("year_month", ym),
    ]);
    [empRes, shiftRes, reqRes, runRes, adjRes].forEach((r) => { if (r.error) console.error("payroll load", r.error); });
    setRoster(empRes.data || []);
    setShifts(shiftRes.data || []);
    setRequests(reqRes.data || []);
    setRuns(runRes.data || []);
    setAdjustments(adjRes.data || []);
    setLoading(false);
  }, [scopeStoreIds, ym]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const ch = sb.channel("payroll_sync")
      .on("postgres_changes", { event: "*", schema: "public", table: "payroll_runs" }, load)
      .on("postgres_changes", { event: "*", schema: "public", table: "payroll_adjustments" }, load)
      .subscribe();
    return () => sb.removeChannel(ch);
  }, [load]);

  const rows = useMemo(() => {
    return roster.map((emp) => {
      const empShifts = shifts.filter((s) => s.employee_id === emp.id && !s.is_day_off && s.start_time && s.end_time);
      const workedHours = empShifts.reduce((sum, s) => sum + shiftHours(s.start_time, s.end_time), 0);
      const empRequests = requests.filter((r) => r.employee_id === emp.id);
      const overtimeRequests = empRequests.filter((r) => r.type === "overtime");
      const overtimeHours = overtimeRequests.reduce((s, r) => s + Number(r.hours), 0);
      const personalLeaveHours = empRequests.filter((r) => r.type === "personal_leave").reduce((s, r) => s + Number(r.hours), 0);
      const isFullTime = emp.employment_type === "full_time";
      const hourlyBase = isFullTime ? Number(emp.base_salary) / 240 : Number(emp.hourly_rate);
      // 加班費逐筆依勞基法分級計算（每筆加班申請以送出當天為一個計算單位，各自從第1小時起算級距）
      const overtimePay = overtimeRequests.reduce((sum, r) => sum + overtimePayForRequest(hourlyBase, r.hours, r.overtime_type || "workday"), 0);
      const attendanceDeduction = isFullTime ? personalLeaveHours * hourlyBase : 0; // 遲到／請假／曠職扣款
      const basePay = isFullTime ? Number(emp.base_salary) : workedHours * Number(emp.hourly_rate);
      const mealAllowance = Number(emp.meal_allowance) || 0;
      const positionAllowance = Number(emp.position_allowance) || 0;
      const fullAttendanceBonus = Number(emp.bonus) || 0;
      const laborInsuranceFee = Number(emp.labor_insurance_fee) || 0;
      const healthInsuranceFee = Number(emp.health_insurance_fee) || 0;
      const incomeTax = Number(emp.income_tax) || 0;
      const empAdjustments = adjustments.filter((a) => a.employee_id === emp.id);
      const adjustmentsTotal = empAdjustments.reduce((sum, a) => sum + Number(a.amount), 0);
      const taxableAdjustments = empAdjustments.filter((a) => a.taxable).reduce((sum, a) => sum + Number(a.amount), 0);
      const grossPay = basePay + mealAllowance + positionAllowance + overtimePay + fullAttendanceBonus + adjustmentsTotal;
      const taxableIncome = grossPay - mealAllowance - (adjustmentsTotal - taxableAdjustments); // 伙食費及標記為免稅的本月調整項不計入應稅所得
      const totalDeduction = attendanceDeduction + laborInsuranceFee + healthInsuranceFee + incomeTax;
      const total = grossPay - totalDeduction;
      return {
        emp, workedHours, overtimeHours, personalLeaveHours, basePay, mealAllowance, positionAllowance,
        overtimePay, fullAttendanceBonus, attendanceDeduction, laborInsuranceFee, healthInsuranceFee, incomeTax,
        empAdjustments, adjustmentsTotal, grossPay, taxableIncome, totalDeduction, total,
      };
    });
  }, [roster, shifts, requests, adjustments]);

  const activeRun = activeStoreId ? runs.find((r) => r.store_id === activeStoreId) : null;
  const locked = activeRun?.status === "locked";

  async function toggleLock() {
    if (lockBusy) return;
    if (!activeStoreId) { toast("請先在上方選擇單一門市才能鎖定薪資"); return; }
    setLockBusy(true);
    try {
      if (locked) {
        const { error } = await sb.from("payroll_runs").update({ status: "draft", locked_by: null, locked_at: null }).eq("id", activeRun.id);
        if (error) { toast("解鎖失敗：" + error.message); return; }
        await logAudit(me.name, "unlock_payroll", `${activeStoreId}:${ym}`);
        toast("已解鎖");
      } else {
        if (!activeRun) {
          const { error } = await sb.from("payroll_runs").insert({ store_id: activeStoreId, year_month: ym, status: "locked", locked_by: me.id, locked_at: new Date().toISOString() });
          if (error) { toast("鎖定失敗：" + error.message); return; }
        } else {
          const { error } = await sb.from("payroll_runs").update({ status: "locked", locked_by: me.id, locked_at: new Date().toISOString() }).eq("id", activeRun.id);
          if (error) { toast("鎖定失敗：" + error.message); return; }
        }
        await logAudit(me.name, "lock_payroll", `${activeStoreId}:${ym}`);
        toast("已鎖定該月薪資");
      }
      load();
    } finally {
      setLockBusy(false);
    }
  }

  function exportCsv() {
    const head = ["姓名", "到職日", "計薪方式", "基本薪資", "伙食費", "職務津貼", "加班費", "全勤獎金", "本月調整項", "應發總額", "遲到/請假/曠職扣款", "勞保費", "健保費", "所得稅", "應稅所得", "應減總額", "實發金額"];
    const lines = [head.join(",")].concat(rows.map((r) => [
      r.emp.name, r.emp.hire_date || "", r.emp.employment_type === "full_time" ? "全職" : "兼職",
      Math.round(r.basePay), Math.round(r.mealAllowance), Math.round(r.positionAllowance), Math.round(r.overtimePay), Math.round(r.fullAttendanceBonus),
      `"${Math.round(r.adjustmentsTotal)}${r.empAdjustments.length ? ` (${r.empAdjustments.map((a) => a.label).join("／")})` : ""}"`,
      Math.round(r.grossPay),
      Math.round(r.attendanceDeduction), Math.round(r.laborInsuranceFee), Math.round(r.healthInsuranceFee), Math.round(r.incomeTax), Math.round(r.taxableIncome), Math.round(r.totalDeduction),
      Math.round(r.total),
    ].join(",")));
    const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `PHASE_薪資明細_${ym}.csv`;
    a.click();
  }

  const isHub = scopeStoreIds.length > 1;
  const monthLabel = `${MONTH_EN[Number(ym.slice(5, 7)) - 1]} ${ym.slice(0, 4)}`;

  if (isHub) {
    return (
      <div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
          <div>
            <p className="ph-eyebrow" style={{ margin: 0, color: T.brown }}>{monthLabel}</p>
            <h2 className="ph-serif" style={{ margin: "2px 0 4px" }}>各門店薪資月結</h2>
            <p style={{ color: T.sub, fontSize: 12.5, margin: 0 }}>薪資資料依門店分開確認、匯出及鎖定，不進行整批月結。</p>
          </div>
          <input className="ph-input" style={{ width: 140 }} type="month" value={ym} onChange={(e) => setYm(e.target.value)} />
        </div>
        {loading ? <p style={{ color: T.sub, marginTop: 18 }}>載入中…</p> : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(260px,1fr))", gap: 16, marginTop: 20 }}>
            {stores.map((s) => {
              const storeRows = rows.filter((r) => r.emp.store_id === s.id);
              const storeTotal = storeRows.reduce((sum, r) => sum + r.total, 0);
              const run = runs.find((rr) => rr.store_id === s.id);
              const storeLocked = run?.status === "locked";
              return (
                <div key={s.id} className="ph-card" style={{ padding: 18 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                    <h3 className="ph-serif" style={{ margin: 0, fontSize: 16, display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ width: 7, height: 7, borderRadius: "999px", background: storeLocked ? T.olive : T.brown, flexShrink: 0 }} />
                      {s.name}
                    </h3>
                    <Badge tone={storeLocked ? "olive" : "brown"}>{storeLocked ? "已鎖定" : "待確認"}</Badge>
                  </div>
                  <p style={{ fontSize: 12.5, color: T.sub, margin: "0 0 4px" }}>本月應發試算</p>
                  <p className="ph-serif" style={{ fontSize: 26, fontWeight: 700, margin: "0 0 14px" }}>NT$ {money(storeTotal)}</p>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, color: T.sub, paddingTop: 12, borderTop: `1px solid ${T.line}`, marginBottom: 14 }}>
                    <span>{storeRows.length} 位夥伴</span>
                    <span>獨立薪資明細</span>
                  </div>
                  <button className="ph-btn small primary" style={{ width: "100%" }} onClick={() => setScope(s.id)}>進入{s.name} →</button>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  const days = monthDays(ym);
  const periodLabel = `${ym}-01 ~ ${ym}-${pad2(days)}`;

  return (
    <div>
      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 6 }}>
        <h2 className="ph-serif" style={{ margin: 0 }}>薪資試算</h2>
        <input className="ph-input" style={{ width: 140 }} type="month" value={ym} onChange={(e) => setYm(e.target.value)} />
        <button className="ph-btn" onClick={exportCsv}>匯出 CSV</button>
        {me.role === "hr" && (
          <button className="ph-btn primary" disabled={!activeStoreId || lockBusy} onClick={toggleLock} title={!activeStoreId ? "請先在上方選擇單一門市" : undefined}>
            {lockBusy ? "處理中…" : locked ? "解鎖" : "鎖定本月"}
          </button>
        )}
        {locked && <Badge tone="brown">{storeById[activeStoreId]?.name} 已鎖定</Badge>}
      </div>
      <p style={{ color: T.sub, fontSize: 12.5, marginTop: 0, marginBottom: 4 }}>
        {storeById[activeStoreId]?.name}・{ym.slice(0, 4)}年{Number(ym.slice(5, 7))}月份薪資明細表　薪資計算區間：{periodLabel}
      </p>
      <p style={{ color: T.sub, fontSize: 12.5, marginTop: 0, marginBottom: 14 }}>
        ※ 此頁為內部薪資試算，正式發薪前仍須人工複核；加班費／遲到請假曠職扣款為系統估算值，勞健保費與所得稅為人資於「人員資料」設定的固定金額，實際金額仍以官方級距表與正式扣繳為準。
      </p>
      {loading ? <p style={{ color: T.sub }}>載入中…</p> : (
        <div className="ph-card" style={{ overflowX: "auto" }}>
          <table className="ph-table">
            <thead>
              <tr>
                <th rowSpan={2} style={{ position: "sticky", left: 0, background: "#FCFAF6", zIndex: 1, minWidth: 140 }}>夥伴</th>
                <th rowSpan={2} className="ph-hide-mobile">到職日</th>
                <th rowSpan={2} className="ph-hide-mobile">計薪方式</th>
                <th colSpan={3} style={{ textAlign: "center" }}>薪資結構</th>
                <th colSpan={3} style={{ textAlign: "center" }}>薪資科目加項</th>
                <th colSpan={4} style={{ textAlign: "center" }}>薪資科目扣項</th>
                <th colSpan={4} style={{ textAlign: "center" }}>薪資總計</th>
                <th rowSpan={2}>個人明細</th>
              </tr>
              <tr>
                <th>基本薪資</th><th>伙食費</th><th>職務津貼</th>
                <th>加班費</th><th>全勤獎金</th><th>本月調整</th>
                <th>遲到/請假/曠職</th><th>勞保費</th><th>健保費</th><th>所得稅</th>
                <th>應稅所得</th><th>應發總額</th><th>應減總額</th><th>實發金額</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.emp.id}>
                  <td style={{ position: "sticky", left: 0, background: "#fff" }}>{r.emp.name}</td>
                  <td className="ph-hide-mobile">{r.emp.hire_date || "—"}</td>
                  <td className="ph-hide-mobile">{r.emp.employment_type === "full_time" ? "月薪" : "時薪"}</td>
                  <td>{money(r.basePay)}</td>
                  <td>{money(r.mealAllowance)}</td>
                  <td>{money(r.positionAllowance)}</td>
                  <td>{money(r.overtimePay)}</td>
                  <td>{money(r.fullAttendanceBonus)}</td>
                  <td>
                    <button className="ph-btn small" style={r.adjustmentsTotal !== 0 ? { borderColor: T.brown, color: T.brown } : undefined} onClick={() => setAdjustingEmp(r.emp)}>
                      {r.adjustmentsTotal !== 0 ? `${r.adjustmentsTotal > 0 ? "+" : ""}${money(r.adjustmentsTotal)}` : "＋ 調整"}
                    </button>
                  </td>
                  <td>{money(r.attendanceDeduction)}</td>
                  <td>{money(r.laborInsuranceFee)}</td>
                  <td>{money(r.healthInsuranceFee)}</td>
                  <td>{money(r.incomeTax)}</td>
                  <td>{money(r.taxableIncome)}</td>
                  <td>{money(r.grossPay)}</td>
                  <td>{money(r.totalDeduction)}</td>
                  <td style={{ fontWeight: 600 }}>NT$ {money(r.total)}</td>
                  <td><button className="ph-btn small" onClick={() => setPayslipRow(r)}>薪資明細 →</button></td>
                </tr>
              ))}
              {rows.length === 0 && <tr><td colSpan={18} style={{ color: T.sub, textAlign: "center" }}>此門市尚無在職夥伴</td></tr>}
            </tbody>
          </table>
        </div>
      )}
      {payslipRow && (
        <PayslipModal store={storeById[activeStoreId]} ym={ym} periodLabel={periodLabel} row={payslipRow} onClose={() => setPayslipRow(null)} />
      )}
      {adjustingEmp && (
        <AdjustmentsModal me={me} emp={adjustingEmp} storeId={adjustingEmp.store_id} ym={ym} locked={locked}
          items={adjustments.filter((a) => a.employee_id === adjustingEmp.id)}
          onClose={() => setAdjustingEmp(null)} toast={toast} />
      )}
    </div>
  );
}

function StaffEditModal({ me, stores, editing, onClose, onSaved }) {
  const isHr = me.role === "hr";
  const [name, setName] = useState(editing.name || "");
  const [storeIdSel, setStoreIdSel] = useState(editing.store_id || stores[0]?.id || "");
  const [position, setPosition] = useState(editing.position || "");
  const [employmentType, setEmploymentType] = useState(editing.employment_type || "full_time");
  const [role, setRole] = useState(editing.role || "staff");
  const [baseSalary, setBaseSalary] = useState(editing.base_salary ?? 0);
  const [hourlyRate, setHourlyRate] = useState(editing.hourly_rate ?? 0);
  const [bonus, setBonus] = useState(editing.bonus ?? 0);
  const [hireDate, setHireDate] = useState(editing.hire_date || "");
  const [mealAllowance, setMealAllowance] = useState(editing.meal_allowance ?? 0);
  const [positionAllowance, setPositionAllowance] = useState(editing.position_allowance ?? 0);
  const [laborInsuranceFee, setLaborInsuranceFee] = useState(editing.labor_insurance_fee ?? 0);
  const [healthInsuranceFee, setHealthInsuranceFee] = useState(editing.health_insurance_fee ?? 0);
  const [incomeTax, setIncomeTax] = useState(editing.income_tax ?? 0);
  const [active, setActive] = useState(editing.active ?? true);
  const [email, setEmail] = useState(editing.email || "");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  async function save() {
    if (!name.trim()) { setErr("請輸入姓名"); return; }
    if (!storeIdSel) { setErr("請選擇所屬門市"); return; }
    setErr(""); setBusy(true);
    const payload = { name: name.trim(), position, employment_type: employmentType, active, store_id: storeIdSel, hire_date: hireDate || null };
    if (isHr) {
      payload.role = role;
      payload.base_salary = Number(baseSalary) || 0;
      payload.hourly_rate = Number(hourlyRate) || 0;
      payload.bonus = Number(bonus) || 0;
      payload.meal_allowance = Number(mealAllowance) || 0;
      payload.position_allowance = Number(positionAllowance) || 0;
      payload.labor_insurance_fee = Number(laborInsuranceFee) || 0;
      payload.health_insurance_fee = Number(healthInsuranceFee) || 0;
      payload.income_tax = Number(incomeTax) || 0;
    }
    let error;
    if (editing.isNew) {
      ({ error } = await sb.from("employees").insert(payload));
    } else {
      ({ error } = await sb.from("employees").update(payload).eq("id", editing.id));
    }
    if (error) { setBusy(false); setErr(error.message); return; }
    await logAudit(me.name, editing.isNew ? "create_employee" : "update_employee", editing.id || name);
    setBusy(false);
    onSaved();
  }

  async function linkAuth() {
    if (!email.trim()) { setErr("請先輸入 Email"); return; }
    const { data, error } = await sb.rpc("link_employee_auth", { p_employee_id: editing.id, p_email: email.trim() });
    if (error) { setErr(error.message); return; }
    if (!data) { setErr("尚未在 Supabase 後台建立此 Email 的登入帳號"); return; }
    setErr(""); alert("已綁定登入帳號");
  }

  return (
    <Modal title={editing.isNew ? "新增夥伴" : `編輯・${editing.name}`} onClose={onClose}>
      <Field label="姓名"><input className="ph-input" value={name} onChange={(e) => setName(e.target.value)} /></Field>
      <Field label={"所屬門市" + (isHr || editing.isNew ? "" : "（僅人資可調整）")}>
        <select className="ph-input" value={storeIdSel} disabled={!isHr && !editing.isNew} onChange={(e) => setStoreIdSel(e.target.value)}>
          {stores.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </Field>
      <Field label="職務"><input className="ph-input" value={position} onChange={(e) => setPosition(e.target.value)} /></Field>
      <Field label="計薪方式">
        <select className="ph-input" value={employmentType} onChange={(e) => setEmploymentType(e.target.value)}>
          <option value="full_time">全職（月薪）</option>
          <option value="part_time">兼職（時薪）</option>
        </select>
      </Field>
      <Field label={"角色" + (isHr ? "" : "（僅人資可調整）")}>
        <select className="ph-input" value={role} disabled={!isHr} onChange={(e) => setRole(e.target.value)}>
          <option value="staff">夥伴</option><option value="manager">店長</option><option value="hr">營運／人資</option>
        </select>
      </Field>
      <div style={{ display: "flex", gap: 8 }}>
        <Field label={"本薪（全職）" + (isHr ? "" : "（僅人資可調整）")}><input className="ph-input" type="number" disabled={!isHr} value={baseSalary} onChange={(e) => setBaseSalary(e.target.value)} /></Field>
        <Field label={"時薪（兼職）" + (isHr ? "" : "（僅人資可調整）")}><input className="ph-input" type="number" disabled={!isHr} value={hourlyRate} onChange={(e) => setHourlyRate(e.target.value)} /></Field>
      </div>
      <Field label="到職日"><input className="ph-input" type="date" value={hireDate} onChange={(e) => setHireDate(e.target.value)} /></Field>
      <div style={{ display: "flex", gap: 8 }}>
        <Field label={"伙食費" + (isHr ? "" : "（僅人資可調整）")}><input className="ph-input" type="number" disabled={!isHr} value={mealAllowance} onChange={(e) => setMealAllowance(e.target.value)} /></Field>
        <Field label={"職務津貼" + (isHr ? "" : "（僅人資可調整）")}><input className="ph-input" type="number" disabled={!isHr} value={positionAllowance} onChange={(e) => setPositionAllowance(e.target.value)} /></Field>
      </div>
      <Field label={"全勤獎金" + (isHr ? "" : "（僅人資可調整）")}><input className="ph-input" type="number" disabled={!isHr} value={bonus} onChange={(e) => setBonus(e.target.value)} /></Field>
      <div style={{ display: "flex", gap: 8 }}>
        <Field label={"勞保費（自付額）" + (isHr ? "" : "（僅人資可調整）")}><input className="ph-input" type="number" disabled={!isHr} value={laborInsuranceFee} onChange={(e) => setLaborInsuranceFee(e.target.value)} /></Field>
        <Field label={"健保費（自付額）" + (isHr ? "" : "（僅人資可調整）")}><input className="ph-input" type="number" disabled={!isHr} value={healthInsuranceFee} onChange={(e) => setHealthInsuranceFee(e.target.value)} /></Field>
      </div>
      <Field label={"所得稅代扣" + (isHr ? "" : "（僅人資可調整）")}><input className="ph-input" type="number" disabled={!isHr} value={incomeTax} onChange={(e) => setIncomeTax(e.target.value)} /></Field>
      <Field label="在職狀態">
        <label style={{ display: "flex", gap: 8, alignItems: "center" }}><input type="checkbox" checked={active} onChange={(e) => setActive(e.target.checked)} /> 在職中</label>
      </Field>
      {!editing.isNew && (
        <Field label="登入帳號 Email（先在 Supabase 後台建立同信箱的 Auth 帳號，再按下方綁定）">
          <div style={{ display: "flex", gap: 8 }}>
            <input className="ph-input" value={email} onChange={(e) => setEmail(e.target.value)} />
            <button className="ph-btn small" type="button" onClick={linkAuth}>綁定</button>
          </div>
        </Field>
      )}
      {err && <div className="ph-err">{err}</div>}
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
        <button className="ph-btn" onClick={onClose}>取消</button>
        <button className="ph-btn primary" disabled={busy} onClick={save}>{busy ? "儲存中…" : "儲存"}</button>
      </div>
    </Modal>
  );
}

function BackupPage({ me, toast }) {
  const [busy, setBusy] = useState(false);
  async function exportAll() {
    setBusy(true);
    const out = { exported_at: new Date().toISOString(), source: "phase-hr", tables: {} };
    for (const t of BACKUP_TABLES) {
      const { data, error } = await sb.from(t).select("*");
      if (error) { toast(`匯出 ${t} 失敗：${error.message}`); setBusy(false); return; }
      out.tables[t] = data;
    }
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `phase-hr_備份_${todayStr()}.json`;
    a.click();
    await logAudit(me.name, "export_backup", "all");
    setBusy(false);
    toast("已匯出");
  }
  async function importFile(file) {
    if (!confirm("匯入只會新增／更新資料，不會刪除既有資料，確定要繼續嗎？")) return;
    setBusy(true);
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      for (const t of BACKUP_TABLES) {
        const rows = parsed.tables?.[t];
        if (!rows || !rows.length) continue;
        const { error } = await sb.from(t).upsert(rows, { onConflict: "id" });
        if (error) throw new Error(`${t}: ${error.message}`);
      }
      await logAudit(me.name, "import_backup", file.name);
      toast("匯入完成");
    } catch (e) {
      toast("匯入失敗：" + e.message);
    }
    setBusy(false);
  }
  return (
    <div>
      <h2 className="ph-serif">備份／還原</h2>
      <div className="ph-card" style={{ padding: 16, maxWidth: 480 }}>
        <p style={{ color: T.sub, fontSize: 13 }}>匯出包含九張業務資料表的完整快照；匯入採非破壞性 upsert（只新增／更新，不刪除）。</p>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <button className="ph-btn primary" disabled={busy} onClick={exportAll}>匯出全部備份</button>
          <label className="ph-btn" style={{ cursor: "pointer" }}>
            匯入還原
            <input type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => e.target.files[0] && importFile(e.target.files[0])} />
          </label>
        </div>
      </div>
    </div>
  );
}

const REPORT_STATUS_TONE = { draft: "sub", submitted: "yellow", signed: "handoff", hr_received: "green", missing: "sub" };

function Dashboard({ me, stores, storeId, scopeStoreIds, scope, setPage }) {
  const canReview = me.role === "manager" || me.role === "hr";
  const today = todayStr();

  // ---- 一般夥伴：簡化版（自己的班表／申請） ----
  const [myShiftToday, setMyShiftToday] = useState(undefined);
  const [myPending, setMyPending] = useState(0);
  useEffect(() => {
    if (canReview) return;
    sb.from("shifts").select("*").eq("employee_id", me.id).eq("work_date", today).maybeSingle()
      .then(({ data }) => setMyShiftToday(data || null));
    sb.from("requests").select("id", { count: "exact", head: true }).eq("employee_id", me.id).eq("status", "pending")
      .then(({ count }) => setMyPending(count || 0));
  }, [canReview, me.id, today]);

  // ---- 店長／人資：完整營運總覽 ----
  const allStoreIds = useMemo(() => stores.map((s) => s.id), [stores]);
  const weekDates = useMemo(() => weekDatesContaining(today), [today]);
  const ym = thisMonthStr();
  const monthRange = useMemo(() => [`${ym}-01`, `${ym}-${pad2(monthDays(ym))}`], [ym]);
  const [roster, setRoster] = useState([]);
  const [monthShifts, setMonthShifts] = useState([]);
  const [pendingReqs, setPendingReqs] = useState([]);
  const [todayReports, setTodayReports] = useState([]);
  const [payrollRuns, setPayrollRuns] = useState([]);
  const [loading, setLoading] = useState(true);
  const [mobileDayIdx, setMobileDayIdx] = useState(() => Math.max(0, weekDates.indexOf(today)));

  const load = useCallback(async () => {
    if (!canReview || !allStoreIds.length) return;
    setLoading(true);
    const [empRes, shiftRes, reqRes, repRes, payRes] = await Promise.all([
      sb.from("employees").select("id,name,position,store_id,employment_type,active").in("store_id", allStoreIds).eq("active", true).order("name"),
      sb.from("shifts").select("*").in("store_id", allStoreIds).gte("work_date", monthRange[0]).lte("work_date", monthRange[1]),
      sb.from("requests").select("id,type,store_id").in("store_id", allStoreIds).eq("status", "pending"),
      sb.from("daily_reports").select("*").in("store_id", allStoreIds).eq("report_date", today),
      sb.from("payroll_runs").select("*").in("store_id", allStoreIds).eq("year_month", ym),
    ]);
    setRoster(empRes.data || []);
    setMonthShifts(shiftRes.data || []);
    setPendingReqs(reqRes.data || []);
    setTodayReports(repRes.data || []);
    setPayrollRuns(payRes.data || []);
    setLoading(false);
  }, [canReview, allStoreIds, monthRange, today, ym]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    if (!canReview) return;
    const ch = sb.channel("dashboard_sync")
      .on("postgres_changes", { event: "*", schema: "public", table: "shifts" }, load)
      .on("postgres_changes", { event: "*", schema: "public", table: "requests" }, load)
      .on("postgres_changes", { event: "*", schema: "public", table: "daily_reports" }, load)
      .subscribe();
    return () => sb.removeChannel(ch);
  }, [canReview, load]);

  const storeById = useMemo(() => Object.fromEntries(stores.map((s) => [s.id, s])), [stores]);
  const scopedRoster = useMemo(() => roster.filter((r) => scopeStoreIds.includes(r.store_id)), [roster, scopeStoreIds]);
  const scopedRosterIds = useMemo(() => new Set(scopedRoster.map((r) => r.id)), [scopedRoster]);
  const weekShifts = useMemo(() => monthShifts.filter((s) => weekDates.includes(s.work_date)), [monthShifts, weekDates]);
  const todayShifts = useMemo(() => monthShifts.filter((s) => s.work_date === today), [monthShifts, today]);
  const scopedMonthShifts = monthShifts.filter((s) => scopedRosterIds.has(s.employee_id) && !s.is_day_off);
  const monthScheduledCount = new Set(scopedMonthShifts.map((s) => s.employee_id)).size;
  const monthPlannedHours = scopedMonthShifts.reduce((sum, s) => sum + shiftHours(s.start_time, s.end_time), 0);
  const scopedPending = pendingReqs.filter((r) => scopeStoreIds.includes(r.store_id));
  const pendingLeave = scopedPending.filter((r) => r.type === "annual_leave" || r.type === "personal_leave").length;
  const pendingOvertime = scopedPending.filter((r) => r.type === "overtime").length;
  const scopedTodayReports = todayReports.filter((r) => scopeStoreIds.includes(r.store_id));
  const reportDoneCount = scopedTodayReports.filter((r) => r.status === "hr_received").length;
  const reportAllDone = scopeStoreIds.length > 0 && reportDoneCount === scopeStoreIds.length;
  function reportStatusOf(sid) {
    const row = todayReports.find((r) => r.store_id === sid);
    return row ? row.status : "missing";
  }
  const REPORT_LABEL2 = { ...REPORT_STATUS_LABEL, missing: "未填寫" };

  const scopeLabel = (scope === "all" || scopeStoreIds.length > 1) ? "三間門市營運總覽" : (storeById[scopeStoreIds[0]]?.name || "");
  const monthLabel = `${today.slice(0, 4)}年${Number(today.slice(5, 7))}月`;
  const todayLabel = `${monthLabel}${Number(today.slice(8, 10))}日（週${weekdayZh(today)}）`;

  const dayOfMonth = Number(today.slice(8, 10));
  const monthDaysTotal = monthDays(thisMonthStr());
  const nearMonthEnd = dayOfMonth >= monthDaysTotal - 6;
  const unlockedPayrollStores = scopeStoreIds.filter((sid) => !payrollRuns.find((p) => p.store_id === sid && p.status === "locked"));
  const noTodo = pendingLeave === 0 && pendingOvertime === 0 && reportAllDone && !(nearMonthEnd && unlockedPayrollStores.length > 0);

  if (!canReview) {
    return (
      <div>
        <p className="ph-eyebrow">{todayLabel}</p>
        <h2 className="ph-serif" style={{ marginTop: 4 }}>嗨，{me.name}</h2>
        <p style={{ color: T.sub, marginTop: -8 }}>{ROLE_LABEL[me.role]}・{storeById[storeId]?.name || ""}</p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(220px,1fr))", gap: 16, marginTop: 20 }}>
          <div className="ph-stat-card accent-brick" onClick={() => setPage("schedule")}>
            <p className="ph-eyebrow" style={{ marginBottom: 8 }}>今日排班</p>
            <p className="ph-serif" style={{ fontSize: 28, margin: "0 0 8px" }}>
              {myShiftToday === undefined ? "…" : myShiftToday ? (myShiftToday.is_day_off ? "休假" : `${myShiftToday.start_time?.slice(0, 5)}–${myShiftToday.end_time?.slice(0, 5)}`) : "尚未排班"}
            </p>
            <span style={{ fontSize: 12.5, color: T.brown }}>查看完整班表 →</span>
          </div>
          <div className="ph-stat-card accent-olive" onClick={() => setPage("requests")}>
            <p className="ph-eyebrow" style={{ marginBottom: 8 }}>我的申請</p>
            <p className="ph-serif" style={{ fontSize: 28, margin: "0 0 8px" }}>{myPending} 件待審核</p>
            <span style={{ fontSize: 12.5, color: T.brown }}>請假／加班申請 →</span>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <p className="ph-eyebrow" style={{ marginBottom: 6 }}>{todayLabel}</p>
          <h2 className="ph-serif" style={{ margin: "0 0 4px" }}>嗨，{me.name}</h2>
          <p style={{ color: T.sub, margin: 0, fontSize: 13 }}>{monthLabel}｜目前查看範圍：{scopeLabel}</p>
        </div>
        <button className="ph-btn primary" onClick={() => setPage("schedule")}>＋ 新增／編輯班表</button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(220px,1fr))", gap: 16, marginTop: 22 }}>
        <div className="ph-stat-card accent-brick" onClick={() => setPage("schedule")}>
          <p className="ph-eyebrow" style={{ marginBottom: 8 }}>本月排班人數</p>
          <p className="ph-serif" style={{ fontSize: 32, margin: "0 0 8px" }}>{loading ? "…" : monthScheduledCount}<span style={{ fontSize: 14, color: T.sub, fontFamily: "'Noto Sans TC',sans-serif" }}> 人</span></p>
          <span style={{ fontSize: 12.5, color: T.brown }}>查看排班表 →</span>
        </div>
        <div className="ph-stat-card accent-olive" onClick={() => setPage("requests")}>
          <p className="ph-eyebrow" style={{ marginBottom: 8 }}>待審核申請</p>
          <p className="ph-serif" style={{ fontSize: 32, margin: "0 0 8px" }}>{loading ? "…" : scopedPending.length}<span style={{ fontSize: 14, color: T.sub, fontFamily: "'Noto Sans TC',sans-serif" }}> 件</span></p>
          <span style={{ fontSize: 12.5, color: T.brown }}>{scopedPending.length > 0 ? "前往處理 →" : "查看紀錄 →"}</span>
        </div>
        <div className="ph-stat-card accent-gold" onClick={() => setPage("schedule")}>
          <p className="ph-eyebrow" style={{ marginBottom: 8 }}>本月預計工時</p>
          <p className="ph-serif" style={{ fontSize: 32, margin: "0 0 8px" }}>{loading ? "…" : Math.round(monthPlannedHours)}<span style={{ fontSize: 14, color: T.sub, fontFamily: "'Noto Sans TC',sans-serif" }}> 小時</span></p>
          <span style={{ fontSize: 12.5, color: T.brown }}>依目前班表自動加總</span>
        </div>
        <div className="ph-stat-card accent-maroon" onClick={() => setPage("daily_report")}>
          <p className="ph-eyebrow" style={{ marginBottom: 8 }}>今日每日回報狀態</p>
          <p className="ph-serif" style={{ fontSize: scopeStoreIds.length > 1 ? 32 : 20, margin: "0 0 8px", color: scopeStoreIds.length > 1 ? T.ink : T[REPORT_STATUS_TONE[reportStatusOf(scopeStoreIds[0])]] }}>
            {loading ? "…" : scopeStoreIds.length > 1
              ? <>{reportDoneCount}<span style={{ fontSize: 15, color: T.sub, fontFamily: "'Noto Sans TC',sans-serif" }}>／{scopeStoreIds.length} 店已完成</span></>
              : REPORT_LABEL2[reportStatusOf(scopeStoreIds[0])]}
          </p>
          <span style={{ fontSize: 12.5, color: !reportAllDone ? T.yellow : T.brown }}>{!reportAllDone ? "每日皆須完成繳交 →" : "前往填寫／查看 →"}</span>
        </div>
      </div>

      <div className="ph-card" style={{ marginTop: 22, padding: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
          <div>
            <p className="ph-eyebrow" style={{ margin: 0, color: T.brown }}>THIS WEEK</p>
            <h3 className="ph-serif" style={{ margin: "2px 0 0", fontSize: 17 }}>本週班表預覽</h3>
          </div>
          <span style={{ fontSize: 12.5, color: T.brown, cursor: "pointer" }} onClick={() => setPage("schedule")}>查看完整班表 →</span>

        ) : (
          <>
            <div className="ph-schedule-preview-desktop" style={{ overflowX: "auto" }}>
              <table className="ph-table ph-schedule-preview">
                <thead>
                  <tr>
                    <th>夥伴</th>
                    {weekDates.map((d) => {
                      const wd = weekdayZh(d);
                      const isWeekend = wd === "六" || wd === "日";
                      return <th key={d} className={isWeekend ? "weekend" : ""}>週{wd}<br /><span style={{ fontWeight: 400 }}>{d.slice(5)}</span></th>;
                    })}
                  </tr>
                </thead>
                <tbody>
                  {scopedRoster.map((r, idx) => (
                    <tr key={r.id}>
                      <td><RosterCell r={r} index={idx} showStore={scopeStoreIds.length > 1} storeName={storeById[r.store_id]?.name} /></td>
                      {weekDates.map((d) => {
                        const s = weekShifts.find((sh) => sh.employee_id === r.id && sh.work_date === d);
                        const cls = s ? (s.is_day_off ? "cell-off" : "cell-work") : "";
                        return <td key={d} className={cls} style={{ textAlign: "center" }}>{s ? (s.is_day_off ? "休" : `${s.start_time?.slice(0, 5)}–${s.end_time?.slice(0, 5)}`) : "–"}</td>;
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="ph-schedule-preview-mobile">
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                <button className="ph-btn small" onClick={() => setMobileDayIdx((i) => Math.max(0, i - 1))} disabled={mobileDayIdx === 0}>‹ 前一天</button>
                <span style={{ fontSize: 13.5, fontWeight: 500 }}>{weekDates[mobileDayIdx]}（週{weekdayZh(weekDates[mobileDayIdx])}）</span>
                <button className="ph-btn small" onClick={() => setMobileDayIdx((i) => Math.min(6, i + 1))} disabled={mobileDayIdx === 6}>後一天 ›</button>
              </div>
              {scopedRoster.map((r, idx) => {
                const d = weekDates[mobileDayIdx];
                const s = weekShifts.find((sh) => sh.employee_id === r.id && sh.work_date === d);
                return (
                  <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: `1px solid ${T.line}` }}>
                    <RosterCell r={r} index={idx} showStore={scopeStoreIds.length > 1} storeName={storeById[r.store_id]?.name} />
                    <div style={{ fontSize: 13, color: s?.is_day_off ? T.sub : T.ink }}>{s ? (s.is_day_off ? "休" : `${s.start_time?.slice(0, 5)}–${s.end_time?.slice(0, 5)}`) : "–"}</div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: me.role === "hr" ? "2fr 1fr" : "1fr", gap: 16, marginTop: 22 }}>
        {me.role === "hr" && (
          <div className="ph-card" style={{ padding: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <p className="ph-eyebrow" style={{ margin: "0 0 4px", color: T.brown }}>TODAY</p>
                <h3 className="ph-serif" style={{ margin: "0 0 14px", fontSize: 16 }}>今日各店人力</h3>
              </div>
              <span className="ph-pill">{Number(today.slice(8, 10))}/{Number(today.slice(5, 7))}　週{weekdayZh(today)}</span>
            </div>
            {loading ? <p style={{ color: T.sub }}>載入中…</p> : stores.map((s) => {
              const storeRoster = roster.filter((r) => r.store_id === s.id);
              const storeTodayShifts = todayShifts.filter((sh) => storeRoster.some((r) => r.id === sh.employee_id));
              const workingCount = storeTodayShifts.filter((sh) => !sh.is_day_off).length;
              const ratio = storeRoster.length ? workingCount / storeRoster.length : 0;
              const label = storeRoster.length === 0 ? "尚無夥伴" : ratio >= 0.8 ? "人力充足" : ratio >= 0.5 ? "人力吃緊" : "人力不足";
              const dotColor = storeRoster.length === 0 ? T.sub : ratio >= 0.8 ? T.green : ratio >= 0.5 ? T.yellow : T.red;
              return (
                <div key={s.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 0", borderBottom: `1px solid ${T.line}` }}>
                  <span style={{ fontSize: 13.5, fontWeight: 500, display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ width: 7, height: 7, borderRadius: "999px", background: dotColor, flexShrink: 0 }} />
                    {s.name}
                  </span>
                  <span style={{ fontSize: 13, color: T.sub }}>{workingCount}／{storeRoster.length} 人</span>
                  <span style={{ fontSize: 12.5, color: dotColor }}>{label}</span>
                </div>
              );
            })}
          </div>
        )}
        <div className="ph-card" style={{ padding: 18 }}>
          <p className="ph-eyebrow" style={{ margin: "0 0 4px", color: T.brown }}>REMINDER</p>
          <h3 className="ph-serif" style={{ margin: "0 0 14px", fontSize: 16 }}>待辦與月結提醒</h3>
          {nearMonthEnd && unlockedPayrollStores.length > 0 && (
            <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: `1px solid ${T.line}`, cursor: "pointer" }} onClick={() => setPage("payroll")}>
              <div style={{ width: 52, textAlign: "center", background: T.brownSoft, borderRadius: 8, padding: "6px 0", flexShrink: 0 }}>
                <div className="ph-serif" style={{ fontSize: 20, fontWeight: 700, color: T.brown, lineHeight: 1 }}>{monthDaysTotal - 6}</div>
                <div style={{ fontSize: 9.5, color: T.brown, letterSpacing: ".08em" }}>{MONTH_EN[Number(today.slice(5, 7)) - 1]}</div>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 500, fontSize: 13.5 }}>{monthLabel}薪資資料確認</div>
                <div style={{ fontSize: 12, color: T.sub }}>請於 {monthDaysTotal - 6} 日前完成請假、加班與異動確認。</div>
              </div>
              <span style={{ fontSize: 12.5, color: T.brown, whiteSpace: "nowrap" }}>前往薪資試算 →</span>
            </div>
          )}
          <TodoRow label="請假申請待審核" count={pendingLeave} onClick={() => setPage("requests")} />
          <TodoRow label="加班申請待審核" count={pendingOvertime} onClick={() => setPage("requests")} />
          <TodoRow label="電子日總表待處理" count={scopeStoreIds.length - reportDoneCount} unit="間門市" onClick={() => setPage("daily_report")} />
          {!loading && noTodo && <p style={{ color: T.sub, fontSize: 13, textAlign: "center", padding: "16px 0" }}>目前沒有待辦事項</p>}
        </div>
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────
   App
──────────────────────────────────────────── */

const PAGE_TITLE = {
  dashboard: "營運總覽", schedule: "門市排班", daily_report: "每日回報", requests: "申請審核",
  payroll: "薪資試算", staff: "人員資料", backup: "備份",
};

function AppShell({ session }) {
  const [me, setMe] = useState(undefined); // undefined=載入中, null=查無員工資料
  const [stores, setStores] = useState([]);
  const [storeId, setStoreId] = useState(null);
  const [scope, setScope] = useState("all"); // 全站共用門市篩選：'all' 或某個 store id，僅 hr 可切換
  const [page, setPage] = useState(() => new URLSearchParams(location.search).get("page") || "dashboard");
  const [toastMsg, setToastMsg] = useState("");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [pendingCount, setPendingCount] = useState(0);

  const toast = useCallback((msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(""), 3200); }, []);

  useEffect(() => {
    (async () => {
      const [meRes, storesRes] = await Promise.all([
        sb.from("employees").select("*").eq("auth_user_id", session.user.id).maybeSingle(),
        sb.from("stores").select("*").eq("active", true).order("sort_order"),
      ]);
      setMe(meRes.data || null);
      setStores(storesRes.data || []);
      if (meRes.data) setStoreId(meRes.data.store_id || storesRes.data?.[0]?.id || null);
    })();
  }, [session.user.id]);

  const canReview = me?.role === "manager" || me?.role === "hr";
  const scopeStoreIds = useMemo(() => {
    if (!me) return [];
    if (me.role === "hr") return scope === "all" ? stores.map((s) => s.id) : [scope];
    return storeId ? [storeId] : [];
  }, [me, scope, stores, storeId]);
  // 需要單一門市才能寫入的頁面（排班/每日回報/薪資/人員）用這個：hr 選「全部門市」時為 null，要求先選定一間店
  const activeStoreId = me?.role === "hr" ? (scope === "all" ? null : scope) : storeId;

  const loadPendingCount = useCallback(() => {
    if (!canReview || !scopeStoreIds.length) { setPendingCount(0); return; }
    sb.from("requests").select("id", { count: "exact", head: true }).in("store_id", scopeStoreIds).eq("status", "pending")
      .then(({ count }) => setPendingCount(count || 0));
  }, [canReview, scopeStoreIds]);

  useEffect(() => { loadPendingCount(); }, [loadPendingCount]);
  useEffect(() => {
    const ch = sb.channel("appshell_requests_badge").on("postgres_changes", { event: "*", schema: "public", table: "requests" }, () => loadPendingCount()).subscribe();
    return () => sb.removeChannel(ch);
  }, [loadPendingCount]);

  useEffect(() => { setSidebarOpen(false); }, [page]);

  if (me === undefined) return <div className="ph-root" style={{ padding: 40 }}>載入中…</div>;
  if (me === null) return (
    <div className="ph-root" style={{ padding: 40 }}>
      <p>此帳號尚未綁定員工資料，請聯絡人資協助設定。</p>
      <button className="ph-btn" onClick={() => sb.auth.signOut()}>登出</button>
    </div>
  );

  const navs = [
    ["dashboard", "營運總覽", "dashboard"],
    ["schedule", "門市排班", "schedule"],
    ...(canReview ? [["daily_report", "每日回報", "daily_report"]] : []),
    ["requests", canReview ? "申請審核" : "請假／加班", "requests"],
    ...(canReview ? [["payroll", "薪資試算", "payroll"], ["staff", "人員資料", "staff"]] : []),
    ...(me.role === "hr" ? [["backup", "備份", "backup"]] : []),
  ];

  return (
    <div className="ph-root ph-shell">
      <div className={"ph-sidebar-backdrop" + (sidebarOpen ? " open" : "")} onClick={() => setSidebarOpen(false)} />
      <aside className={"ph-sidebar" + (sidebarOpen ? " open" : "")}>
        <div className="ph-sidebar-brand">
          <div className="ph-word">PHASE</div>
          <div className="ph-sub">PEOPLE &amp; SHIFT</div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          {navs.map(([k, l, icon]) => (
            <button key={k} className={"ph-nav-item" + (page === k ? " on" : "")} onClick={() => setPage(k)}>
              <span className="ph-nav-icon"><Icon name={icon} /></span>
              <span>{l}</span>
              {k === "requests" && canReview && pendingCount > 0 && <span className="ph-nav-badge">{pendingCount}</span>}
            </button>
          ))}
        </div>
        <div className="ph-sidebar-foot">
          <div className="ph-avatar">{me.name.slice(0, 1)}</div>
          <div style={{ minWidth: 0, flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{me.name}</div>
            <div style={{ fontSize: 11.5, color: T.sidebarSub }}>{ROLE_LABEL[me.role]}</div>
          </div>
          <button className="ph-btn small" style={{ background: "transparent", borderColor: T.sidebarLine, color: T.sidebarInk }} onClick={() => sb.auth.signOut()}>登出</button>
        </div>
      </aside>

      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
        <div className="ph-topbar">
          <button className="ph-hamburger-btn" onClick={() => setSidebarOpen(true)} aria-label="開啟選單"><Icon name="hamburger" /></button>
          <div style={{ minWidth: 0 }}>
            <p className="ph-eyebrow" style={{ margin: 0 }}>PHASE COFFEE ROASTERS</p>
            <h1 className="ph-serif" style={{ fontSize: 19, margin: 0 }}>{PAGE_TITLE[page]}</h1>
          </div>
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <span className="ph-pill">{ROLE_LABEL[me.role]}</span>
            {me.role === "hr" ? (
              <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: T.sub }}>
                處理門市
                <select className="ph-input" style={{ width: 150 }} value={scope} onChange={(e) => setScope(e.target.value)}>
                  <option value="all">全部門市（營運）</option>
                  {stores.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </label>
            ) : (
              <span style={{ fontSize: 12.5, color: T.sub }}>{stores.find((s) => s.id === storeId)?.name || ""}</span>
            )}
            {canReview && (
              <button className="ph-bell-btn" onClick={() => setPage("requests")} aria-label="待審核申請通知">
                <Icon name="bell" size={16} />
                {pendingCount > 0 && <span className="ph-nav-badge">{pendingCount}</span>}
              </button>
            )}
          </div>
        </div>
        <main className="ph-main-pad" style={{ flex: 1, padding: "24px 40px", minWidth: 0 }}>
          <div style={{ maxWidth: 1460, margin: "0 auto" }}>
            {page === "dashboard" && <Dashboard me={me} stores={stores} storeId={storeId} scope={scope} scopeStoreIds={scopeStoreIds} setPage={setPage} />}
            {page === "schedule" && <SchedulePage me={me} stores={stores} storeId={storeId} scope={scope} scopeStoreIds={scopeStoreIds} activeStoreId={activeStoreId} setScope={setScope} toast={toast} />}
            {page === "requests" && <RequestsPage me={me} stores={stores} storeId={storeId} scope={scope} scopeStoreIds={scopeStoreIds} setScope={setScope} toast={toast} />}
            {page === "daily_report" && canReview && <DailyReportPage me={me} stores={stores} storeId={storeId} scopeStoreIds={scopeStoreIds} toast={toast} />}
            {page === "payroll" && canReview && <PayrollPage me={me} stores={stores} storeId={storeId} scope={scope} scopeStoreIds={scopeStoreIds} activeStoreId={activeStoreId} setScope={setScope} toast={toast} />}
            {page === "staff" && canReview && <StaffPage me={me} stores={stores} storeId={storeId} scope={scope} scopeStoreIds={scopeStoreIds} activeStoreId={activeStoreId} setScope={setScope} toast={toast} />}
            {page === "backup" && me.role === "hr" && <BackupPage me={me} toast={toast} />}
          </div>
        </main>
      </div>
      {toastMsg && <div className="ph-toast">{toastMsg}</div>}
    </div>
  );
}

function SetNewPasswordScreen({ onDone }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    if (pw.length < 6) { setErr("密碼至少需要 6 個字元"); return; }
    if (pw !== pw2) { setErr("兩次輸入的密碼不一致"); return; }
    setErr(""); setBusy(true);
    try {
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) { setErr("設定失敗：" + error.message); return; }
      onDone();
    } catch (e2) {
      setErr("設定時發生錯誤：" + (e2?.message || String(e2)));
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="ph-root" style={{ display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div className="ph-card" style={{ width: 360, padding: 28 }}>
        <h1 className="ph-serif" style={{ fontSize: 20, marginTop: 0, marginBottom: 4 }}>設定新密碼</h1>
        <p style={{ color: T.sub, fontSize: 12.5, marginTop: 0, marginBottom: 20 }}>請輸入你要使用的新密碼</p>
        <form onSubmit={submit}>
          <Field label="新密碼">
            <input className="ph-input" type="password" required autoComplete="new-password" value={pw} onChange={(e) => setPw(e.target.value)} />
          </Field>
          <Field label="再輸入一次">
            <input className="ph-input" type="password" required autoComplete="new-password" value={pw2} onChange={(e) => setPw2(e.target.value)} />
          </Field>
          {err && <div className="ph-err">{err}</div>}
          <button className="ph-btn primary" style={{ width: "100%", marginTop: 6 }} disabled={busy} type="submit">
            {busy ? "設定中…" : "確認設定"}
          </button>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(undefined); // undefined=確認中, null=未登入
  const [recovering, setRecovering] = useState(false);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session ?? null));
    const { data: sub } = sb.auth.onAuthStateChange((event, s) => {
      if (event === "PASSWORD_RECOVERY") setRecovering(true);
      setSession(s);
    });
    return () => sub.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <div className="ph-root" style={{ padding: 40 }}>載入中…</div>;
  if (recovering) return <SetNewPasswordScreen onDone={() => setRecovering(false)} />;
  if (session === null) return <Login />;
  return <AppShell session={session} />;
}

// 全域錯誤攔截：本機除錯用（無 DevTools 情境下把錯誤直接顯示在畫面上）
function showDebugBox(text) {
  const el = document.getElementById("debug-box") || document.createElement("div");
  el.id = "debug-box"; el.className = "ph-debug";
  el.textContent = text;
  document.body.appendChild(el);
}
window.addEventListener("error", (e) => {
  showDebugBox("JS Error: " + e.message + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
});
window.addEventListener("unhandledrejection", (e) => {
  showDebugBox("Unhandled Promise Rejection: " + (e.reason?.message || e.reason));
});

ReactDOM.createRoot(document.getElementById("root")).render(<><style>{css}</style><App /></>);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
